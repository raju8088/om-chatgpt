  /providers/voices:
    get:
      tags:
        - Providers
      operationId: listVoices
      summary: List voices
      description: |
        Retrieve voices with filtering and pagination support. ElevenLabs
        supports advanced filtering by name, language, accent, and gender.
        Other providers support basic pagination only.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Basic usage - list all voices with default pagination
            voices = client.providers.list_voices()
            print(voices)
            # Returns: {'voices': [...], 'total': 123, 'page': 1, 'page_size': 30, 'filters_applied': False}

            # With pagination
            voices = client.providers.list_voices(page=2, page_size=50)
            print(voices)

            # Filter by specific provider (only supports basic pagination)
            voices = client.providers.list_voices(provider='eleven_labs', page=1, page_size=20)
            print(voices)

            # Advanced filtering (ElevenLabs only)
            voices = client.providers.list_voices(
                provider='eleven_labs',
                search='professional',
                language='en',
                accent='american',
                gender='male',
                page=1,
                page_size=15
            )
            print(voices)

            # Search by voice name/description
            voices = client.providers.list_voices(
                provider='eleven_labs',
                search='excited',
                gender='female'
            )
            print(voices)

            # Filter by language
            voices = client.providers.list_voices(
                provider='eleven_labs',
                language='en'
            )
            print(voices)

            # Filter by accent
            voices = client.providers.list_voices(
                provider='eleven_labs',
                accent='british'
            )
            print(voices)
      parameters:
        - name: provider
          in: query
          description: TTS provider to list voices from. Omit to list across all providers.
          schema:
            type: string
            enum:
              - eleven_labs
              - google
              - deepgram
              - cartesia
              - sarvam
        - name: search
          in: query
          description: Substring match against voice name or description. ElevenLabs only.
          schema:
            type: string
        - name: language
          in: query
          description: ISO language code (e.g. `en`, `hi`, `es`). ElevenLabs only.
          schema:
            type: string
        - name: accent
          in: query
          description: Accent label (e.g. `american`, `british`). ElevenLabs only.
          schema:
            type: string
        - name: gender
          in: query
          description: Filter voices by gender. ElevenLabs only.
          schema:
            type: string
            enum:
              - male
              - female
        - name: page
          in: query
          description: 1-indexed page number.
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Voices per page. Capped at 100.
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        "200":
          description: Voices and filter metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Voice"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
                  filters_applied:
                    type: object
                    description: Echoes the filter parameters the request applied. `null` for any filter that wasn't sent.
                    properties:
                      provider:
                        type: string
                        nullable: true
                      search:
                        type: string
                        nullable: true
                      language:
                        type: string
                        nullable: true
                      accent:
                        type: string
                        nullable: true
                      gender:
                        type: string
                        nullable: true
              example:
                voices:
                  - id: 1
                    name: aura-luna-en
                    display_name: luna
                    service: deepgram
                    sample_url: https://res.cloudinary.com/deepgram/video/upload/v1709565351/aura/luna_docs_clom0e.wav
                    tags:
                      - feminine
                      - Young Adult
                      - en-us
                      - American
                      - Friendly, Natural, Engaging
                      - IVR
                total: 30
                page: 1
                page_size: 30
                filters_applied:
                  provider: null
                  search: null
                  language: null
                  accent: null
                  gender: null
