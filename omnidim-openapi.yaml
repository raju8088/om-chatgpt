      responses:
        "200":
          description: Number added to the pool.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: success
                message: Number added to pool
  /calls/bulk_call/{bulk_call_id}/numbers/{assignment_id}:
    put:
      tags:
        - Bulk calls
      operationId: setBulkCallNumberActive
      summary: Pause or resume a pool number
      description: |
        Stop or resume dialing from one number in the pool.

        Pausing is what you want when a number starts going bad mid-campaign:
        dialing moves to the next number in sequence and the paused number keeps
        its history and counters. The last active number of a running campaign
        cannot be paused, since the campaign would have nothing to dial from.

        Send the state you want rather than a toggle, so retrying the same
        request is harmless.

        `assignment_id` is the number's id **within this campaign's pool**, from
        List rotation pool. It is not the `phone_number_id`.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X PUT "https://backend.omnidim.io/api/v1/calls/bulk_call/314/numbers/508" \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"is_active": false}'
      parameters:
        - in: path
          name: bulk_call_id
          required: true
          schema:
            type: integer
          description: Id of the bulk call campaign.
        - in: path
          name: assignment_id
          required: true
          schema:
            type: integer
          description: The `assignment_id` from List rotation pool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_active
              properties:
                is_active:
                  type: boolean
                  example: false
                  description: "`false` pauses the number, `true` resumes it."
      responses:
        "200":
          description: New state of the number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  is_active:
                    type: boolean
              example:
                status: success
                is_active: false
  /calls/bulk_call/{campaign_id}/add_contacts:
    post:
      tags:
        - Bulk calls
      operationId: addBulkCallContacts
      summary: Add contacts in bulk
      description: |
        Add up to 1000 contacts to a campaign in one request.

        This is the batch form of Add contact to dynamic campaign. Prefer it
        whenever you have more than a handful: one request of 500 contacts is
        far cheaper than 500 requests, on your side and ours.

        Repeated numbers are kept, not merged. If the same number appears twice
        with different variables, it is called twice, because two rows for one
        number usually means two real reasons to call.

        Rows that fail validation are reported in `rejected` and the rest are
        still added, so a single bad number does not lose the batch. If the
        campaign has `call_conditions`, rows that do not match are added with
        status `Skipped`.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://backend.omnidim.io/api/v1/calls/bulk_call/314/add_contacts" \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "contacts": [
                  {"to_number": "+15551234567", "custom_variables": {"contact_name": "Ravi"}},
                  {"to_number": "+15559876543", "custom_variables": {"contact_name": "Priya"}}
                ]
              }'
      parameters:
        - in: path
          name: campaign_id
          required: true
          schema:
            type: integer
          description: Id of the bulk call campaign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contacts
              properties:
                contacts:
                  type: array
                  maxItems: 1000
                  description: |
                    Each row needs `to_number`. Note this differs from the
                    `contact_list` on Create bulk call, which uses
                    `phone_number` and takes loose keys: here the variables go
                    in an explicit `custom_variables` object.
                  items:
                    type: object
                    required:
                      - to_number
                    properties:
                      to_number:
                        type: string
                        description: Number to call, in international format.
                        example: "+15551234567"
                      custom_variables:
                        type: object
                        description: |
                          Passed to the agent as context for this call, so it
                          can use them in the conversation.
                        additionalProperties: true
                        example:
                          contact_name: Ravi
                      metadata:
                        type: object
                        description: |
                          Stored with the contact and returned on its row in
                          Bulk call results. Not shown to the agent.
                        additionalProperties: true
      responses:
        "200":
          description: |
            What was added and what was not. `added` and `rejected` together
            account for every row you sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  added:
                    type: array
                    items:
                      type: object
                      properties:
                        line_id:
                          type: integer
                        to_number:
                          type: string
                  rejected:
                    type: array
                    description: |
                      One entry per row that was not added. `index` is the
                      row's position in the array you sent.
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        reason:
                          type: string
                  added_count:
                    type: integer
                  rejected_count:
                    type: integer
                  message:
                    type: string
                  campaign_id:
                    type: integer
                  campaign_status:
                    type: string
              example:
                status: success
                message: 1 of 2 contacts added
                campaign_id: 314
                campaign_status: in_progress
                added:
                  - line_id: 8801
                    to_number: "+15551234567"
                added_count: 1
                rejected:
                  - index: 1
                    reason: "to_number is not a valid phone number"
                rejected_count: 1
  /calls/bulk_call/{bulk_call_id}/start:
    post:
      tags:
        - Bulk calls
      operationId: startBulkCall
      summary: Start a draft campaign
      description: |
        Start a campaign that was created with `save_as_draft: true`.

        Drafts let you build a campaign over several requests: create it, add
        contacts in batches, set the number pool, set concurrency, then start
        when everything is in place. A campaign that is already running,
        scheduled, or finished cannot be started.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://backend.omnidim.io/api/v1/calls/bulk_call/314/start" \
              -H "Authorization: Bearer YOUR_API_KEY"
      parameters:
        - in: path
          name: bulk_call_id
          required: true
          schema:
            type: integer
          description: Id of the bulk call campaign.
      responses:
        "200":
          description: Campaign started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  current_status:
                    type: string
              example:
                status: success
                message: Campaign started
                current_status: in_progress
  /calls/bulk_call/{bulk_call_id}/concurrency:
    put:
      tags:
        - Bulk calls
      operationId: setBulkCallConcurrency
      summary: Change concurrency
      description: |
        Change how many calls the campaign places at once, including while it is
        running. Raise it to finish sooner, lower it if your team cannot keep up
        with transfers or your numbers are being answered less.

        The ceiling is your account's concurrency limit.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X PUT "https://backend.omnidim.io/api/v1/calls/bulk_call/314/concurrency" \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"concurrent_call_limit": 5}'
      parameters:
        - in: path
          name: bulk_call_id
          required: true
          schema:
            type: integer
          description: Id of the bulk call campaign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - concurrent_call_limit
              properties:
                concurrent_call_limit:
                  type: integer
                  minimum: 1
                  example: 5
                  description: Calls to place at once.
      responses:
        "200":
          description: New concurrency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  concurrent_call_limit:
                    type: integer
              example:
                status: success
                message: Concurrency updated
                concurrent_call_limit: 5
  /calls/bulk_call/{bulk_call_id}/manual_retry:
    post:
      tags:
        - Bulk calls
      operationId: retryBulkCall
      summary: Retry contacts that did not connect
      description: |
        Re-queue contacts that did not connect, without creating a new campaign.

        Use it after a campaign finishes with more no-answers than you expected,
        or when the reason was on your side (a bad window, a number that was
        having a bad day). Retried contacts keep their original variables.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://backend.omnidim.io/api/v1/calls/bulk_call/314/manual_retry" \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"retry_strategy": "all", "max_retries": 2}'
      parameters:
        - in: path
          name: bulk_call_id
          required: true
          schema:
            type: integer
          description: Id of the bulk call campaign.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                retry_strategy:
                  type: string
                  default: all
                  description: |
                    Which contacts to re-queue. `all` takes everything that did
                    not connect.
                max_retries:
                  type: integer
                  description: Skip contacts already retried this many times.
                failure_reasons:
                  type: array
                  description: |
                    Re-queue only contacts that failed for these reasons, for
                    example `no-answer` and `busy`.
                  items:
                    type: string
      responses:
        "200":
          description: How many contacts were re-queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  current_status:
                    type: string
              example:
                status: success
                message: 42 contacts queued for retry
                current_status: in_progress
  /calls/bulk_call/{bulk_call_id}/daily-time-control:
    put:
      tags:
        - Bulk calls
      operationId: setBulkCallDailyTimeControl
      summary: Set calling hours
      description: |
        Restrict a campaign to a daily calling window, in the campaign's
        timezone. Outside the window the campaign holds rather than finishing,
        and resumes the next day.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X PUT "https://backend.omnidim.io/api/v1/calls/bulk_call/314/daily-time-control" \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "enable_daily_auto_start": true,
                "daily_start_time": 9,
                "daily_start_timezone": "Asia/Kolkata",
                "enable_daily_hard_stop": true,
                "daily_stop_time": 18,
                "daily_stop_timezone": "Asia/Kolkata"
              }'
      parameters:
        - in: path
          name: bulk_call_id
          required: true
          schema:
            type: integer
          description: Id of the bulk call campaign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enable_daily_hard_stop
                - enable_daily_auto_start
              properties:
                enable_daily_hard_stop:
                  type: boolean
                  example: true
                  description: Stop dialing at `daily_stop_time` each day.
                daily_stop_time:
                  type: number
                  example: 18
                  description: |
                    Hour of day to stop, 0 to 23. Fractions are allowed, so
                    `17.5` is 17:30. Required when the hard stop is on.
                daily_stop_timezone:
                  type: string
                  example: Asia/Kolkata
                  description: Timezone for the stop time.
                enable_daily_auto_start:
                  type: boolean
                  example: true
                  description: Resume dialing at `daily_start_time` each day.
                daily_start_time:
                  type: number
                  example: 9
                  description: |
                    Hour of day to resume, 0 to 23. Required when auto start
                    is on.
                daily_start_timezone:
                  type: string
                  example: Asia/Kolkata
                  description: Timezone for the start time.
      responses:
        "200":
          description: Updated calling window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: success
                message: Daily time control updated
