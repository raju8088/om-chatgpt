  /agents/{agent_id}/versions/{version_number}/diff:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the agent.
      - name: version_number
        in: path
        required: true
        schema:
          type: integer
        description: The version number, as returned in `version_number` from the list or save endpoints.
    get:
      tags:
        - Agents
      operationId: diffAgentVersion
      summary: Diff an agent version
      description: >-
        Get a record-level diff for this version. By default it shows what
        changed in this version compared with the version before it. Use
        `against=current` to compare with the agent's live config (what
        restoring this version would change), or `against=<number>` to compare
        with another version.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # What changed in this version (vs the previous one)
            agent_id = "your_agent_id_here"
            version_number = 5
            response = client.agent.diff_version(agent_id, version_number)
            print(response)
      parameters:
        - name: against
          in: query
          schema:
            type: string
          description: >-
            What to compare against. Omit or `previous` for the version before
            this one (the default). `current` for the agent's live config. A
            version number to compare with that version.
      responses:
        "200":
          description: Diff between the two versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                    description: Whether there is any difference between the two sides.
                  first:
                    type: boolean
                    description: >-
                      True when this is the earliest version and there is
                      nothing before it to compare (only for the default
                      previous-version comparison).
                  from:
                    type: object
                    nullable: true
                    description: The version being compared from, or null when `first` is true.
                    properties:
                      version_number:
                        type: integer
                      name:
                        type: string
                  to:
                    description: >-
                      The comparison target: an object with the version number
                      and name for a version, or a text label such as
                      `current setup`.
                    oneOf:
                      - type: object
                        properties:
                          version_number:
                            type: integer
                          name:
                            type: string
                      - type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        area:
                          type: string
                          description: Section of the agent this group of changes belongs to (e.g. Settings, Prompt, Transfer rules, Post-call actions, Knowledge, Integrations, Web widget, Conversation flow, Other settings).
                        changes:
                          type: array
                          items:
                            type: object
                            properties:
                              field:
                                type: string
                              label:
                                type: string
                              old:
                                type: string
                              new:
                                type: string
                        records:
                          type: array
                          items:
                            type: object
                            properties:
                              op:
                                type: string
                                enum:
                                  - added
                                  - removed
                                  - edited
                              label:
                                type: string
              example:
                changed: true
                first: false
                from:
                  version_number: 4
                  name: Before pricing tweak
                to:
                  version_number: 5
                  name: Working pricing script
                groups:
                  - area: Settings
                    changes:
                      - field: llm_service
                        label: Model
                        old: gpt-4.1-mini
                        new: gpt-4o-mini
                  - area: Knowledge
                    records:
                      - op: added
                        label: pricing-sheet.pdf
        "403":
          description: Version history is not enabled for this organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
              example:
                error: feature_disabled
                error_description: Version history is not enabled for this organization
        "404":
          description: No agent or version matching that ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
              example:
                error: not_found
                error_description: Version not found for this agent
  /agents/{agent_id}/versions/{version_number}/restore:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the agent.
      - name: version_number
        in: path
        required: true
        schema:
          type: integer
        description: The version number, as returned in `version_number` from the list or save endpoints.
    post:
      tags:
        - Agents
      operationId: restoreAgentVersion
      summary: Restore an agent version
      description: >-
        Restore a version onto the live agent. Your current setup is
        saved first as a backup version, so restoring is undoable.
        Configuration is brought back; any knowledge files or
        integrations that were deleted since this version was saved
        can't be re-linked, and are reported in `skipped`.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Restore an agent to a previous version
            agent_id = "your_agent_id_here"
            version_number = 5
            response = client.agent.restore_version(agent_id, version_number)
            print(response)
      responses:
        "200":
          description: Version restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  restored_from:
                    type: integer
                    description: The version number that was restored.
                  safety_version:
                    type: integer
                    nullable: true
                    description: Version number of the backup taken of the agent's setup right before this restore, or null if no backup was needed.
                  skipped:
                    type: array
                    description: References the restore could not bring back (e.g. a knowledge file or integration deleted since this version was saved).
                    items:
                      type: object
                      properties:
                        item:
                          type: string
                        label:
                          type: string
                        reason:
                          type: string
              example:
                success: true
                restored_from: 5
                safety_version: 7
                skipped:
                  - item: knowledge_file
                    label: old-pricing-sheet.pdf
                    reason: deleted
        "403":
          description: Version history is not enabled for this organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
              example:
                error: feature_disabled
                error_description: Version history is not enabled for this organization
        "404":
          description: No agent or version matching that ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
              example:
                error: not_found
                error_description: Version not found for this agent
  /calls/dispatch:
    post:
      tags:
        - Calls
      operationId: dispatchCall
      summary: Dispatch call
      description: |
        Initiate a call to a phone number using a specified agent. The
        phone number must include a country code with a leading plus.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Dispatch a call to a specific number using an agent
            agent_id = 123  # Replace with your agent ID
            to_number = "+15551234567"  # Must include country code
            from_number_id = 23 # get the from number id from phone number API. /api/v1/phone_number/list
            call_context = {
                "customer_name": "John Doe",
                "account_id": "ACC-12345",
                "priority": "high"
            }

            response = client.call.dispatch_call(agent_id, to_number, call_context=call_context)
            print(response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agent_id
                - to_number
              properties:
                agent_id:
                  type: integer
                  description: The ID of the agent that will handle the call.
                  example: 158910
                to_number:
                  type: string
                  description: The phone number to call. Must include country code (e.g., +15551234567).
                  example: "+15551234567"
                from_number_id:
                  type: integer
                  description: Id of a phone number on your account to place the call from (see the phone number list endpoint). Omit to use the platform's default number.
                  example: 23
                call_context:
                  type: object
                  description: Optional context information as key-value pairs to be passed to the agent during the call. Can contain any custom fields relevant to your use case.
                  additionalProperties: true
                  example:
                    user_name: Jane Doe
                    account_id: A-2031
                    last_order: "2026-04-15"
                metadata:
                  type: object
                  additionalProperties: true
                  description: |
                    Key-value pairs stored on the call for your own tracking
                    (e.g. CRM or lead IDs). Not shared with the agent; echoed
                    back as `metadata` in the post-call webhook so you can
                    correlate results with your records.
                  example:
                    crm_lead_id: lead_9876
                    source: website_form
              example:
                agent_id: 158910
                to_number: "+15551234567"
                from_number_id: 23
                call_context:
                  user_name: Jane Doe
                  account_id: A-2031
                  last_order: "2026-04-15"
                metadata:
                  crm_lead_id: lead_9876
                  source: website_form
      responses:
        "200":
          description: Call dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    description: Dispatch state on the platform side. `dispatched` means the call has been queued for the dialer.
                    example: dispatched
                  requestId:
                    type: integer
                    description: Internal call request id. Use it to correlate with `call_request_id` on `/calls/logs`.
                    example: 3166940
                  custom_variables_count:
                    type: integer
                    description: Number of keys the platform extracted from `call_context`.
              example:
                success: true
                status: dispatched
                requestId: 3166940
                custom_variables_count: 1
