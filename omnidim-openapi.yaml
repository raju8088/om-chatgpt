  /providers/voice/{voice_id}:
    get:
      tags:
        - Providers
      operationId: getVoice
      summary: Get voice details
      description: Detailed metadata for a specific voice.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Get detailed information about a specific voice
            voice_details = client.providers.get_voice(123)
            print(voice_details)
            # Returns: {'id': 123, 'name': 'Voice Name', 'provider': 'eleven_labs', ...}
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: integer
          description: Numeric id of the voice, as returned in the `id` field of the voices list.
      responses:
        "200":
          description: Voice details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceDetail"
              example:
                id: 1
                name: aura-luna-en
                display_name: luna
                service: deepgram
                sample_url: https://res.cloudinary.com/deepgram/video/upload/v1709565351/aura/luna_docs_clom0e.wav
        "404":
          description: No voice with that ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Voice not found
  /simulations:
    get:
      tags:
        - Simulation
      operationId: listSimulations
      summary: List simulations
      description: Retrieve simulations with pagination.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # List all simulations with pagination
            response = client.simulation.list(pageno=1, pagesize=10)
            print(response)
      parameters:
        - name: pageno
          in: query
          description: Page number for pagination.
          schema:
            type: integer
            default: 1
        - name: pagesize
          in: query
          description: Items per page (max 150).
          schema:
            type: integer
            default: 10
            maximum: 150
      responses:
        "200":
          description: Paginated list of simulations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/Simulation"
                  total_records:
                    type: integer
              example:
                records: []
                total_records: 0
    post:
      tags:
        - Simulation
      operationId: createSimulation
      summary: Create simulation
      description: Create a new test simulation with scenarios.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Create a basic simulation
            response = client.simulation.create(
                name="Restaurant Order Taking Test",
                agent_id=123,
                number_of_call_to_make=1,
                concurrent_call_count=3,
