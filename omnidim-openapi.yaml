        call_status_counts:
          type: object
          description: Map of per-status counts. Keys are call statuses (e.g. `completed`, `Pending`, `no-answer`, `busy`, `Failed`, `Skipped`); values are integer counts.
          additionalProperties:
            type: integer
        create_date:
          type: string
          description: Campaign creation timestamp in the user's timezone.
        write_date:
          type: string
          description: Last update timestamp in the user's timezone.
