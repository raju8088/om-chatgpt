openapi: 3.1.0
info:
  title: OmniDimension API
  version: "1.0"
  description: |
    Public REST API for the OmniDimension voice-agent platform. Use it
    to manage agents, dispatch calls, run bulk-call campaigns, manage
    knowledge bases, attach phone numbers, run agent simulations, and
    administer reseller accounts.
  contact:
    name: OmniDimension
    url: https://omnidim.io
servers:
  - url: https://omnidim.io/api/v1
    description: Production
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication. Obtain your API key from the
        OmniDimension dashboard.
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 30
        total:
          type: integer
          example: 100
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    SessionError:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code.
        error_description:
          type: string
          description: Human-readable explanation.
    ShopCarrier:
      type: object
      description: |
        One carrier in a region: a network you can buy numbers from, with its
        own stock and its own identity verification.
      properties:
        carrier:
          type: string
          description: How you address this carrier. Stable across a rename, so it is safe to store.
          example: carrier-1
        label:
          type: string
          description: Display name for the carrier.
          example: Carrier 1
        description:
          type: string
          description: What this carrier stocks, so you can tell them apart.
          example: Landline numbers, 80 series.
        kyc_required:
          type: boolean
          description: Whether a client must complete this carrier's verification before buying on it.
        unavailable:
          type: boolean
          description: |
            `true` while this carrier is not taking orders. It is still
            named, so a stored name keeps resolving; buy on the other one
            meanwhile.
        unavailable_note:
          type: string
          nullable: true
          description: Short reason, when the carrier is unavailable. `null` otherwise.
    CarrierRequiredError:
      allOf:
        - $ref: "#/components/schemas/SessionError"
        - type: object
          properties:
            region:
              type: string
              enum: [IN, US]
            carriers:
              type: array
              description: |
                The carriers to choose from, each with what it stocks, so the
                refusal carries its own fix and is where you discover the
                names.
              items:
                $ref: "#/components/schemas/ShopCarrier"
    ResellerDashboardMenuAccess:
      type: object
      description: |
        Reseller-managed dashboard menu access flags. Each property is
        a boolean toggle for a feature area in the child user's
        dashboard. On read endpoints, only flags the reseller
        themselves has enabled are returned (so a child cannot have a
        flag the reseller doesn't have).
      properties:
        is_bots_menu_access: { type: boolean }
        is_leads_access: { type: boolean }
        is_voice_cloning_access: { type: boolean }
        is_workflow_access: { type: boolean }
        is_asr_evaluation_menu_access: { type: boolean }
        is_train_with_call_recording_menu_access: { type: boolean }
        is_call_logs_menu_access: { type: boolean }
        is_call_simulation_menu_access: { type: boolean }
        is_omni_crm_access: { type: boolean }
        access_to_monitor_live_call: { type: boolean }
        is_whatsapp_flow_enabled: { type: boolean }
        is_billing_menu_access: { type: boolean }
        is_knowledge_base_access: { type: boolean }
        is_integration_access: { type: boolean }
        is_phone_number_access: { type: boolean }
        is_bulk_call_access: { type: boolean }
        is_analytics_access: { type: boolean }
    Agent:
      type: object
      description: An AI voice agent.
      properties:
        id:
          type: integer
          example: 158910
        name:
          type: string
          example: Customer Support Agent
        bot_type:
          type: string
          example: prompt
        bot_call_type:
          type: string
          enum:
            - Incoming
            - Outgoing
        user_id:
          type: integer
        user_name:
          type: string
        organization_id:
          type: integer
        welcome_message:
          type: string
        is_welcome_message_dynamic:
          type: boolean
        is_welcome_message_interruption:
          type: boolean
        is_interruption_allowed:
          type: boolean
        interruption_min_words:
          type: integer
        status_of_building_flow:
          type: string
          example: Completed
        context_breakdown:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              context_title:
                type: string
              context_body:
                type: string
              is_enabled:
                type: boolean
              is_auto_generated:
                type: boolean
        languages:
          type: array
          description: Resolved language records. Each entry is `{value, label}` from `bot.language`.
          items:
            type: object
            properties:
              value:
                type: integer
              label:
                type: string
        llm_service:
          type: string
          example: gpt-4o-mini
        llm_temperature:
          type: number
        timezone:
          type: string
          description: IANA timezone set on this agent. `false` when unset, in which case the account timezone applies.
          example: America/New_York
        llm_straming_enabled:
          type: boolean
        asr_service:
          type: string
          example: deepgram_stream
        asr_deepgram_model:
          type: string
        asr_deepgram_numerals:
          type: boolean
        asr_deepgram_punctuate:
          type: boolean
        asr_deepgram_smart_format:
          type: boolean
        asr_deepgram_diarize:
          type: boolean
        silence_timeout:
          type: integer
        voice_provider:
          type: string
        voice_external_id:
          type: string
          description: External voice ID from the provider.
        voice_name:
          type: string
        english_voice_accent:
          type: string
        eleven_lab_voice_public_owner_id:
          type: string
          nullable: true
        speech_speed:
          type: number
        enable_web_search:
          type: boolean
        web_search_engine:
          type: string
        background_noise_enabled:
          type: boolean
        background_noice_name:
          oneOf:
            - type: string
            - type: boolean
        background_audio_volume:
          type: number
        initial_ringing_sound_enabled:
          type: boolean
        voicemail_enabled:
          type: boolean
          description: Whether voicemail detection is on. To change it, send the nested `voicemail.enabled` field when creating or updating the agent.
        voicemail_message:
          type: string
          description: Message the agent leaves when voicemail is detected. To change it, send the nested `voicemail.message` field when creating or updating the agent.
        is_end_call_enabled:
          type: boolean
        end_call_condition:
          type: string
        end_call_message:
          type: string
        end_call_message_type:
          type: string
        end_call_message_prompt:
          type: string
        max_call_duration_in_sec:
          type: integer
        user_idle_threshold_sec:
          type: integer
        first_ideal_message:
          type: string
        second_ideal_message:
          type: string
        last_ideal_message:
          type: string
        is_first_ideal_message_dynamic:
          type: boolean
        is_second_ideal_message_dynamic:
          type: boolean
        is_transfer_enabled:
          type: boolean
        is_custom_api_transfer_enabled:
          type: boolean
          description: >-
            Allow custom API integrations to transfer live calls. When
            enabled and a custom API response includes
            "__omni_transfer_number", the call is transferred to that number
            immediately. Optional "__omni_transfer_message" sets what the
            caller hears during the handover.
        transfer_options:
          type: array
          items:
            type: object
            properties:
              number:
                type: string
              type:
                type: string
                enum: [static, dynamic]
              backup_numbers:
                type: array
                items:
                  type: string
              transfer_condition:
                type: string
              transfer_message:
                type: string
        post_call_config_ids:
          type: array
          description: Resolved post-call notification configs. One entry per email/webhook destination.
          items:
            type: object
            properties:
              id:
                type: integer
              delivery_method:
                type: string
                enum: [Email, Webhook]
              destination:
                type: string
                description: Comma-separated recipients for Email; webhook url for Webhook.
              include_summary:
                type: boolean
              include_full_conversation:
                type: boolean
              include_sentiment:
                type: boolean
              include_extracted_info:
                type: boolean
              extracted_variables:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    description:
                      type: string
        attach_file_ids:
          type: array
          description: IDs of knowledge-base files attached to this agent.
          items:
            type: integer
        integrations:
          type: array
          description: Connected integration records (HubSpot, Salesforce, Slack, etc.).
          items:
            type: object
        flow_data:
          oneOf:
            - type: object
            - type: boolean
        bot_action_name:
          oneOf:
            - type: string
            - type: boolean
        version_history_enabled:
          type: boolean
          description: Whether version history is turned on for this agent's organization.
    AgentVersion:
      type: object
      description: A saved snapshot of an agent's configuration.
      properties:
        id:
          type: integer
        version_number:
          type: integer
        name:
          type: string
          description: >-
            Display name of the version. `Auto-saved` for automatic
            versions and `Backup before restore` for system versions.
        note:
          type: string
        kind:
          type: string
          enum:
            - manual
            - auto
            - system
          description: >-
            `manual`: a person saved it. `auto`: auto-saved after
            editing went quiet. `system`: a backup taken automatically
            before a restore.
        created_by:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        create_date:
          type: string
          format: date-time
        summary:
          type: object
          description: At-a-glance counts of what the version contains.
          properties:
            llm_service:
              type: string
            voice_name:
              type: string
            bot_type:
              type: string
            languages:
              type: array
              items:
                type: string
            context_sections:
              type: integer
            transfer_options:
              type: integer
            post_call_configs:
              type: integer
            knowledge_files:
              type: integer
            integrations:
              type: integer
            flow_nodes:
              type: integer
        change_summary:
          type: object
          description: >-
            What changed in this version compared with the previous one.
            Included when listing versions. `first` is true for the earliest
            version, which has nothing before it to compare.
          properties:
            first:
              type: boolean
            count:
              type: integer
              description: Number of settings that changed.
            items:
              type: array
              description: The changed settings, most useful first.
              items:
                type: object
                properties:
                  label:
                    type: string
                    example: Transcription
                  old:
                    type: string
                    nullable: true
                    example: Cartesia
                  new:
                    type: string
                    nullable: true
                    example: Soniox
    Call:
      type: object
      description: A single call log entry.
      properties:
        id:
          type: integer
          example: 3517893
        bot_name:
          type: string
        organization_branch_name:
          type: string
        is_bot_response:
          type: boolean
        time_of_call:
          type: string
          description: Display-formatted timestamp (`MM/DD/YYYY HH:MM:SS`).
          example: "05/06/2026 13:31:54"
        from_number:
          type: string
        to_number:
          type: string
        call_direction:
          type: string
          enum: [inbound, outbound]
        call_status:
          type: string
          example: completed
        call_duration:
          type: string
          description: Display-formatted duration (`M:S`).
          example: "0:42"
        call_duration_in_seconds:
          type: integer
        call_duration_in_minutes:
          type: number
        recording_url:
          oneOf:
            - type: string
              format: uri
            - type: boolean
          description: Signed URL to the recording, or `false` if unavailable.
        internal_recording_url:
          oneOf:
            - type: string
            - type: boolean
        channel_type:
          type: string
          example: Voice
        sentiment_score:
          type: string
          example: Positive
        sentiment_analysis_details:
          type: string
        call_conversation:
          type: string
          description: Full transcript with `<br/>`-separated turns.
        extracted_variables:
          type: object
          additionalProperties: true
        interactions:
          type: array
          items:
            type: object
            additionalProperties: true
        post_call_actions:
          type: object
          additionalProperties: true
        cqs_score:
          type: number
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        aggregated_estimated_cost:
          type: number
        model_name:
          type: string
        asr_service:
          type: string
        tts_service:
          type: string
        is_simulation:
          type: boolean
        is_voicemail:
          type: boolean
        amd_detected:
          type: boolean
        hangup_source:
          oneOf:
            - type: string
            - type: 'null'
        hangup_reason:
          oneOf:
            - type: string
            - type: 'null'
        call_request_id:
          type: object
          additionalProperties: true
    BulkCallSummary:
      type: object
      description: A bulk-call campaign.
      properties:
        id:
          type: integer
          example: 11880
        name:
          type: string
        campaign_type:
          type: string
          example: ai_agent
        user_id:
          type: integer
        user_name:
          type: string
        bot_id:
          type: integer
        bot_name:
          type: string
        twilio_number:
          type: string
        status:
          type: string
          example: completed
        is_scheduled:
          type: boolean
        scheduled_datetime:
          oneOf:
            - type: string
            - type: 'null'
        recording_file_name:
          oneOf:
            - type: string
            - type: 'null'
        failed_reason:
          oneOf:
            - type: string
            - type: boolean
        concurrent_call_limit:
          type: integer
        total_calls:
          type: integer
        completed_calls:
          type: integer
        total_calls_made:
          type: integer
        total_calls_to_dispatch:
          type: integer
        total_pending_calls:
          type: integer
        total_not_reachable_calls:
          type: integer
        total_call_transfer_count:
          type: integer
        create_date:
          type: string
    BulkCallLine:
      type: object
      description: One contact's result inside a bulk-call campaign.
      properties:
        id:
          type: integer
          description: Id of this contact row in the campaign.
        to_number:
          type: string
        from_number:
          type: string
          description: |
            The number this contact was called from. With a rotation pool this
            varies between contacts.
        call_status:
          type: string
        interaction_status:
          type: string
        failed_reason:
          type: string
          nullable: true
        dispatched_at:
          type: string
          nullable: true
          description: "`YYYY-MM-DD HH:MM:SS`, UTC."
        custom_variables:
          type: object
          description: The variables submitted with this contact.
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        retry_attempt:
          type: integer
        retry_scheduled:
          type: boolean
        retry_scheduled_datetime:
          type: string
          nullable: true
        reschedule_requested:
          type: boolean
        reschedule_datetime:
          type: string
          nullable: true
        reschedule_status:
          type: string
        call:
          type: object
          nullable: true
          description: |
            Null until the contact has actually been called, so a queued or
            skipped row has no `call`.
          properties:
            recording_id:
              type: integer
              description: |
                Fetch the transcript with `GET /calls/logs/{recording_id}`. The
                transcript is not included here on purpose: they reach 212 KB,
                which would make a full page tens of megabytes.
            time_of_call:
              type: string
            duration_seconds:
              type: number
            duration_minutes:
              type: number
            recording_url:
              type: string
            call_status:
              type: string
            sentiment_score:
              type: string
            extracted_variables:
              type: object
              description: What the agent extracted during this call.
              additionalProperties: true
            is_voicemail:
              type: boolean
            answering_machine_detected:
              type: boolean
    BulkCallPoolNumber:
      type: object
      description: One number in a campaign's rotation pool.
      properties:
        assignment_id:
          type: integer
          description: |
            This number's id within the pool. Use it to pause or resume the
            number. It is not the `phone_number_id`.
        phone_number_id:
          type: integer
        phone_number:
          type: string
        sequence:
          type: integer
          description: Rotation order. Lowest dials first.
        is_active:
          type: boolean
          description: A paused number stays in the pool and is skipped.
        is_dialing_now:
          type: boolean
          description: Exactly one number in a pool is dialing at a time.
        calls_dispatched:
          type: integer
          description: Lifetime calls from this number in this campaign.
        calls_this_cycle:
          type: integer
          description: |
            Calls since this number last became active. `fixed_count` rotation
            compares this against `calls_per_number`, so this is the one to
            watch for the next rotation.
        health_score:
          type: number
          nullable: true
          description: Null until enough calls have been placed to score it.
    BulkCallDetail:
      type: object
      description: A bulk-call campaign with configuration, execution stats, and the active number pool.
      properties:
        id:
          type: integer
          description: Campaign ID.
        name:
          type: string
          description: Campaign name.
        campaign_type:
          type: string
          description: Campaign type. Typically `ai_agent` for agent-driven campaigns.
        user_id:
          type: integer
          description: ID of the user who owns the campaign.
        user_name:
          type: string
          description: Display name of the owning user.
        bot_id:
          type: integer
          description: ID of the agent that handles calls for this campaign.
        bot_name:
          type: string
          description: Name of the agent.
        twilio_number:
          type: string
          description: Outbound number used for the campaign (E.164 format).
        status:
          type: string
          description: Current campaign status (e.g. `draft`, `scheduled`, `in_progress`, `paused`, `completed`, `cancelled`).
        is_scheduled:
          type: boolean
          description: True when the campaign is scheduled to start at a future time.
        is_dynamic:
          type: boolean
          description: True for dynamic campaigns that source contacts via webhook.
        scheduled_datetime:
          oneOf:
            - type: string
            - type: 'null'
          description: Scheduled start time, formatted in the campaign timezone. Null when not scheduled.
        timezone:
          type: string
          description: IANA timezone the campaign was scheduled in.
        recording_file_id:
          oneOf:
            - type: integer
            - type: 'null'
          description: ID of the uploaded contact list file, if any.
        recording_file_name:
          oneOf:
            - type: string
            - type: 'null'
          description: Filename of the uploaded contact list, if any.
        failed_reason:
          oneOf:
            - type: string
            - type: boolean
          description: Reason the campaign failed to start, or `false` when there is none.
        auto_retry:
          type: boolean
          description: Whether failed calls are automatically retried.
        auto_retry_schedule:
          type: string
          description: When retries fire (e.g. `immediately`, `after_delay`).
        retry_schedule_days:
          type: integer
          description: Days to wait before retrying when `auto_retry_schedule` uses a delay.
        retry_schedule_hours:
          type: integer
          description: Hours to wait before retrying when `auto_retry_schedule` uses a delay.
        retry_count:
          type: integer
          description: Total retries already performed.
        retry_limit:
          type: integer
          description: Maximum retries allowed per contact.
        enabled_reschedule_call:
          type: boolean
          description: Whether contacts can request a reschedule mid-call.
        concurrent_call_limit:
          type: integer
          description: Maximum number of calls running in parallel.
        enable_daily_hard_stop:
          type: boolean
          description: Whether the campaign pauses each day at `daily_stop_time`.
        daily_stop_time:
          type: number
          description: Daily hard-stop time as a float-of-day (e.g. 18.5 = 18:30).
        daily_stop_time_formatted:
          type: string
          description: Daily hard-stop time formatted as `HH:MM`.
        daily_stop_timezone:
          type: string
          description: IANA timezone for the daily hard-stop.
        enable_daily_auto_start:
          type: boolean
          description: Whether the campaign auto-resumes each day at `daily_start_time`.
        daily_start_time:
          type: number
          description: Daily auto-start time as a float-of-day.
        daily_start_time_formatted:
          type: string
          description: Daily auto-start time formatted as `HH:MM`.
        daily_start_timezone:
          type: string
          description: IANA timezone for the daily auto-start.
        variable_config:
          type: array
          description: Custom variables exposed to the agent for each contact.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Variable ID.
              variable_name:
                type: string
                description: Variable name as referenced in the agent prompt.
              variable_type:
                type: string
                description: Variable data type (e.g. `text`, `number`, `enum`).
              enum_values:
                description: Allowed values when `variable_type` is `enum`; `false` otherwise.
                oneOf:
                  - type: array
                    items:
                      type: string
                  - type: boolean
        rotation_strategy:
          type: string
          description: How outbound numbers rotate across the pool (e.g. `none`, `round_robin`, `health_aware`).
        calls_per_number:
          type: integer
          description: Calls placed on a single number before rotating.
        rotation_health_threshold:
          type: number
          description: Health-score threshold below which a number is skipped during rotation.
        rotation_fallback:
          type: string
          description: Fallback behavior when no healthy number is available (e.g. `pause`, `continue`).
        current_number_assignment_id:
          oneOf:
            - type: integer
            - type: 'null'
          description: ID of the number assignment currently dispatching calls. Null when idle.
        number_pool_size:
          type: integer
          description: Number of phone numbers configured in the rotation pool.
        number_pool:
          type: array
          description: Phone numbers available for outbound rotation.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Pool assignment ID.
              phone_number_id:
                type: integer
                description: Underlying phone-number record ID.
              phone_number:
                type: string
                description: The phone number in E.164 format.
              phone_number_name:
                type: string
                description: Display label for the number.
              sequence:
                type: integer
                description: Position of the number in the rotation order.
              is_active:
                type: boolean
                description: Whether the number is currently eligible for dispatch.
              calls_dispatched:
                type: integer
                description: Calls dispatched on this number in this campaign.
              calls_picked_up:
                type: integer
                description: Calls answered on this number in this campaign.
              rolling_cpr:
                oneOf:
                  - type: number
                  - type: 'null'
                description: Rolling call-pickup rate. Null until enough calls have been dispatched.
              health_score:
                oneOf:
                  - type: number
                  - type: 'null'
                description: Computed health score for the number. Null when not yet computed.
        total_calls:
          type: integer
          description: Total contacts in the campaign.
        total_calls_to_dispatch:
          type: integer
          description: Contacts still eligible for dispatch (excludes skipped).
        total_calls_made:
          type: integer
          description: Calls dispatched so far (excludes pending, in-progress, skipped, retry-scheduled).
        completed_calls:
          type: integer
          description: Calls that finished (any non-pending, non-skipped status).
        pending_calls:
          type: integer
          description: Calls in `Pending` or `In Progress` state.
        failed_calls:
          type: integer
          description: Calls that ended with status `Failed`.
        skipped_calls:
          type: integer
          description: Calls explicitly skipped (e.g. duplicates, opt-outs).
        low_interaction_calls:
          type: integer
          description: Calls flagged as `No/Low Interaction`.
        no_low_interaction_calls:
          type: integer
          description: Same as `low_interaction_calls`. Kept for backward compatibility.
        total_pending_calls:
          type: integer
          description: Pending plus in-progress count.
        total_not_reachable_calls:
          type: integer
          description: Calls that ended with `failed`, `no-answer`, or `busy`.
        total_skipped_calls:
          type: integer
          description: Skipped count (matches `skipped_calls`).
        total_reschedule_calls:
          type: integer
