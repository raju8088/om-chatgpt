    ExtractedVariable:
      type: object
      required:
        - key
        - prompt
      properties:
        key:
          type: string
          description: Unique identifier for the variable in the post-call payload.
          example: customer_issue
        prompt:
          type: string
          description: Instruction for the model on what to pull out of the conversation.
          example: Identify the main issue the customer is experiencing.
    AgentConfigInput:
      type: object
      description: Agent configuration.
      properties:
        name:
          type: string
          description: Name for the agent.
          example: Customer Support Agent
        welcome_message:
          type: string
          description: Initial message the agent will say when answering a call.
          example: Hello! How can I help you today?
        is_welcome_message_dynamic:
          type: boolean
          description: When true, the welcome message is treated as a directive the agent uses to generate a tailored greeting for each call, rather than being spoken word for word. When false, the welcome message is spoken exactly as written.
        is_welcome_message_interruption:
          type: boolean
          description: Allow the caller to interrupt the welcome message. When false, the agent finishes speaking the welcome before listening.
        is_interruption_allowed:
          type: boolean
          description: Global toggle for whether the caller can interrupt the agent mid-sentence at any point in the call.
        dynamic_variables:
          type: object
          description: |
            Key/value map used to substitute placeholders in the agent's
            prompt and welcome message at call time. Reference a variable
            in your prompt with `{{variable_name}}`. Useful for
            personalising the same agent across many calls.
          additionalProperties:
            type: string
          example:
            customer_name: Jane Doe
            order_id: "ORD-12345"
        context_breakdown:
          type: array
          description: List of context breakdowns, each containing `title`, `body`, and optional `is_enabled`.
          items:
            type: object
            required:
              - title
              - body
            properties:
              title:
                type: string
                description: Title of the breakdown.
                example: Purpose
              body:
                type: string
                description: Body of the breakdown, the detailed prompt content.
                example: This agent helps customers with product inquiries and support issues.
              is_enabled:
                type: boolean
                default: true
                description: Whether this section is included in the prompt.
        call_type:
          type: string
          enum:
            - Incoming
            - Outgoing
          description: Call type of the assistant.
        timezone:
          type: string
          description: IANA timezone for this agent, for example `Asia/Kolkata`. Sets the local date and time the agent works with during calls. If not set, the account timezone is used as fallback. Pass an empty string to clear it.
          example: America/New_York
        transcriber:
          type: object
          description: Configuration for the speech-to-text transcriber.
          properties:
            provider:
              type: string
              enum:
                - deepgram_stream
                - cartesia
                - sarvam
                - azure_stream
                - soniox
              description: The speech-to-text provider to use.
              example: deepgram_stream
            model:
              type: string
              enum:
                - nova-3
                - nova-2
              description: The model to use for transcription (required when provider is `deepgram_stream`).
              example: nova-3
            language:
              type: string
              description: |
                Language code for the transcriber. Format and supported
                values depend on the provider (e.g. `en-US` for Deepgram,
                `hi-IN` for Sarvam). Applies regardless of which
                `provider` is selected.
              example: en-US
            silence_timeout_ms:
              type: integer
              description: Silence timeout in milliseconds.
              example: 400
            should_apply_noise_reduction:
              type: boolean
              description: Reduce background noise on the inbound audio stream before transcription.
            interruption_min_words:
              type: integer
              minimum: 1
              description: Minimum number of words the caller must say before their speech is treated as an interruption.
              example: 2
            max_call_duration_in_sec:
              type: integer
              minimum: 1
              description: Hard upper bound on call length in seconds. The agent will end the call once this is reached.
              example: 600
            first_ideal_message:
              type: string
              description: |
                First nudge spoken when the caller goes silent past the
                idle threshold. Set `is_first_ideal_message_dynamic` to
                `true` to have the LLM regenerate this each time.
            is_first_ideal_message_dynamic:
              type: boolean
              description: When true, `first_ideal_message` is treated as a prompt and the LLM generates a fresh nudge each call.
            second_ideal_message:
              type: string
              description: Second nudge spoken if silence continues after the first.
            is_second_ideal_message_dynamic:
              type: boolean
              description: When true, `second_ideal_message` is treated as a prompt and the LLM generates a fresh nudge each call.
            numerals:
              type: boolean
              description: Convert numbers from words to digits.
            punctuate:
              type: boolean
              description: Add punctuation to the transcript.
            smart_format:
              type: boolean
              description: Apply smart formatting to the transcript.
            diarize:
              type: boolean
              description: Identify different speakers in the transcript.
        model:
          type: object
          description: Configuration for the language model.
          properties:
            model:
              type: string
              enum:
                - azure-gpt-4.1-mini
                - azure-gpt-4.1-nano
                - azure-gpt-4o
                - azure-gpt-4o-mini
                - gemini-2.5-flash
                - gemini-2.5-flash-lite
                - gpt-3.5-turbo
                - gpt-4.1-mini
                - gpt-4.1-nano
                - gpt-4o
                - gpt-4o-mini
                - gpt-5.1
                - llama-3.3-70b-versatile
              description: The language model to use. The current catalog is returned by the LLM providers list.
              example: gpt-4.1-mini
            temperature:
              type: number
              minimum: 0
              maximum: 1
              description: Controls randomness in the model's output (0.0 to 1.0).
              example: 0.7
        voice:
          type: object
          description: >-
            Configuration for the text-to-speech voice. `provider` and
            `voice_id` identify the voice together, so send both to change it.
            `provider` on its own is not accepted, and a `voice_id` on its own
            leaves the voice as it was. The other fields here apply
            independently.
          dependentRequired:
            provider:
              - voice_id
          properties:
            provider:
              type: string
              enum:
                - eleven_labs
                - google
                - cartesia
                - sarvam
              description: >-
                The voice provider to use. The current catalog is returned by
                the TTS providers list. Send `voice_id` alongside it.
              example: eleven_labs
            voice_id:
              type: string
              description: >-
                The provider's voice identifier, returned in the `name` field of
                the voices list (not the numeric `id`). Takes effect when
                `provider` is sent alongside it.
              example: JBFqnCBsd6RMkjVDRZzb
            model:
              type: string
              description: |
                TTS model identifier. Only consumed when `provider` is
                `cartesia` (e.g. `sonic-3.5`). For ElevenLabs and other
                providers the model is implied by `voice_id` and this
                field is ignored.
              example: sonic-3.5
            speech_speed:
              type: number
              minimum: 0.5
              maximum: 2.0
              default: 1.0
              description: Playback speed multiplier for the agent's voice. 1.0 is normal speed.
        web_search:
          type: object
          description: Configuration for web search capabilities.
          properties:
            enabled:
              type: boolean
              description: Enable or disable web search functionality.
            provider:
              type: string
              enum:
                - DuckDuckGo
              description: The search provider to use.
              example: DuckDuckGo
        post_call_actions:
          type: object
          description: Side effects that fire once the call ends. Configure email, webhook, or both.
          properties:
            email:
              type: object
              properties:
                enabled:
                  type: boolean
                recipients:
                  type: array
                  description: Email addresses that should receive the notification.
                  items:
                    type: string
                    format: email
                  example:
                    - support@example.com
                include:
                  type: array
                  description: Which sections to include in the email body.
                  items:
                    type: string
                    enum:
                      - summary
                      - extracted_variables
                      - fullConversation
                      - sentiment
                extracted_variables:
                  type: array
                  description: Variables the model should pull out of the conversation for the email.
                  items:
                    $ref: "#/components/schemas/ExtractedVariable"
                trigger_call_statuses:
                  type: array
                  description: |
                    Call outcomes that should fire this action. Omit to
                    use the default (`completed`, `voicemail_detected`).
                    Pass an explicit list to also include failed calls,
                    no-answers, busy signals, etc.
                  items:
                    type: string
                    enum:
                      - completed
                      - voicemail_detected
                      - failed
                      - no_answer
                      - busy
                      - cancelled
                  example:
                    - completed
                    - voicemail_detected
            webhook:
              type: object
              properties:
                enabled:
                  type: boolean
                url:
                  type: string
                  format: uri
                  description: Endpoint that receives a POST with the call payload.
                  example: https://your-webhook-endpoint.com/omnidim-callback
                include:
                  type: array
                  description: Which sections to include in the webhook body.
                  items:
                    type: string
                    enum:
                      - summary
                      - extracted_variables
                      - fullConversation
                      - sentiment
                extracted_variables:
                  type: array
                  description: Variables the model should pull out of the conversation for the webhook.
                  items:
                    $ref: "#/components/schemas/ExtractedVariable"
                trigger_call_statuses:
                  type: array
                  description: |
                    Call outcomes that should fire this webhook. Omit to
                    use the default (`completed`, `voicemail_detected`).
                  items:
                    type: string
                    enum:
                      - completed
                      - voicemail_detected
                      - failed
                      - no_answer
                      - busy
                      - cancelled
                  example:
                    - completed
                    - failed
        transfer:
          type: object
          description: Conditional call transfer to a human agent or another number.
          properties:
            enabled:
              type: boolean
            transfer_options:
              type: array
              description: >-
                Where to transfer the call and under what condition. The first
                matching condition wins. In an agent update, sending this list
                replaces all saved options. Omit it to keep them unchanged, or
                send an empty array to clear them.
              items:
                type: object
                required:
                  - number
                  - transfer_condition
                  - transfer_message
                properties:
                  number:
                    type: string
                    description: Primary phone number to transfer to. Include country code with leading `+`.
                    example: "+15551234567"
                  type:
                    type: string
                    enum:
                      - static
                      - dynamic
                    default: static
                    description: |
                      `static` transfers to `number`. `dynamic` lets the agent
                      pick a number at runtime based on the conversation.
                  backup_numbers:
                    type: array
                    description: Fallback numbers tried if the primary is unreachable.
                    items:
                      type: string
                  transfer_condition:
                    type: string
                    description: Natural-language condition that triggers this transfer option.
                    example: Transfer if the customer asks to speak with a human.
                  transfer_message:
                    type: string
                    description: Message the agent says to the caller before executing the transfer.
                    example: Please hold while I connect you to one of our agents.
        end_call:
          type: object
          description: Hang up automatically when a condition is met.
          properties:
            enabled:
              type: boolean
            condition:
              type: string
              description: Natural-language condition that triggers ending the call. Only evaluated when `enabled` is true.
              example: End the call once the customer's issue is resolved.
            message:
              type: string
              description: What the agent says before hanging up.
              example: Thank you for contacting us. Have a great day!
            message_type:
              type: string
              enum:
                - static
                - prompt
              description: |
                `static` speaks `message` verbatim. `prompt` treats
                `message_prompt` as an LLM instruction and generates a
                fresh closing line each call (useful for matching the
                caller's language and tone).
            message_prompt:
              type: string
              description: LLM prompt used to generate the closing line when `message_type` is `prompt`.
              example: End the call politely in the same language the user is speaking.
        background_track:
          type: object
          description: Ambient background noise that plays under the agent's voice.
          properties:
            enabled:
              type: boolean
              description: Whether to mix the ambient track under the agent's audio.
            name:
              type: string
              enum:
                - call_center
                - filler
                - office
                - office_1
                - restaurant
              description: Ambient track to mix under the agent.
            volume:
              type: number
              minimum: 0
              maximum: 1
              default: 0.2
              description: Volume level on a 0–1 scale. Default 0.2.
            tts_volume_reduction:
              type: number
              minimum: 0
              maximum: 1
              description: Amount to drop the agent's TTS volume while the ambient track plays, on a 0–1 scale. Helps the voice cut through without raising the overall mix.
        initial_ringing_sound_enabled:
          type: boolean
          description: Plays a ringing tone after the call is picked up, until the agent starts speaking.
        voicemail:
          type: object
          description: >-
            Voicemail / answering-machine handling for outbound calls. Set this with the
            nested object shown here; the agent object returns these values as the
            flat fields `voicemail_enabled` and `voicemail_message`. Voicemail detection
            is an access-gated feature. If it isn't enabled for your account,
            [request access](https://omnidim.io/contact-us?reason=product&lock=1).
          properties:
            enabled:
              type: boolean
              description: Detect voicemail and leave your message instead of speaking to a machine.
            message:
              type: string
              description: Message to leave when voicemail is detected.
        languages:
          type: array
          description: Languages the agent should support. Pass each language as a display-name string exactly as it appears in the dashboard's language picker. Unrecognized names are skipped.
          items:
            type: string
          example:
            - English (India)
            - Hindi
security:
  - BearerAuth: []
tags:
  - name: Agents
    description: |
      Create, retrieve, update, and delete AI voice agents. Configure
      transcriber, model, voice, integrations, and post-call actions.
  - name: Calls
    description: |
      Dispatch calls to phone numbers, retrieve call logs, and inspect
      individual call sessions.
  - name: Bulk calls
    description: |
      Run outbound campaigns against a contact list. Schedule, retry,
      pause, resume, and monitor live status.
  - name: Knowledge base
    description: |
      Upload, manage, and attach PDF documents to agents.
  - name: Phone numbers
    description: |
      Search and buy phone numbers, release them, attach and detach them
      from agents, and import numbers you already own from Twilio, Exotel,
      or your own SIP trunk.
  - name: Providers
    description: |
      Discover available LLM, voice, STT, and TTS providers, with
      advanced filtering for ElevenLabs voices.
  - name: Simulation
    description: |
      Run automated agent test simulations with scenarios and quick-test
      workflows.
  - name: Reseller
    description: |
      Manage your clients: verify their identity, add users, transfer
      credits, and control dashboard access flags. To buy a client a phone
      number, use the Phone numbers endpoints with a `user_id`.
      Reseller accounts only.
      [Request access](https://omnidim.io/contact-us?reason=reseller_api&lock=1).
  - name: Sessions
    description: |
      Create short-lived Sessions for web calls: your server trades its
      API key for a per-conversation token and a ready-to-use WebSocket
      URL, so your client can talk to an agent without any credential in
      the page.
paths:
  /sessions/create:
    post:
      tags:
        - Sessions
      operationId: createSession
      summary: Create session
      description: |
        Create a voice Session: a short-lived, single-conversation
        reservation that lets a client hold a live voice chat with your
        agent. This is step 1 of 2. Creating the Session does not start any
        audio on its own; it returns a `ws_url` that a client then connects
        to over WebSocket to actually talk.

        Call this endpoint from your server with your API key, and return
        only the `ws_url` to your client. The API key must never reach the
        browser. The `ws_url` is the only thing the client needs, and it is
        safe to hand out because it is single-use and expires. For how to
        connect and talk, see "Connect the client and talk" below the
        request details.
      x-codeSamples:
        - lang: js
          label: Browser SDK (connect after create)
          source: |
            import { WebSession } from '@omnidim-ai/client';

            // 1. Ask YOUR server to create the session (keeps the API key
            //    server-side) and return the ws_url.
            const { ws_url } = await fetch('/create-omnidim-session', {
              method: 'POST',
            }).then((r) => r.json());

            // 2. The browser connects to the ws_url and talks. No API key here.
            const session = new WebSession();
            session.on('transcript', (t) => console.log(t.role, t.text));
            await session.start({ wsUrl: ws_url });
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agent_id
                - type
              properties:
                agent_id:
                  type: integer
                  description: ID of the agent the session talks to.
                  example: 158910
                type:
                  type: string
                  default: voice
                  example: voice
                  enum:
                    - voice
                  description: The session type. Only `voice` is supported.
                custom_variables:
                  type: object
                  additionalProperties: true
                  description: |
                    Per-session variables that personalize the conversation.
                    Set server-side, so visitors cannot tamper with them.
                  example:
                    name: Demo User
                metadata:
                  type: object
                  additionalProperties: true
                  description: |
                    Key-value pairs stored on the session for your own
                    tracking (e.g. CRM or lead IDs). Not shared with the
                    agent; echoed back as `metadata` in the post-call
                    webhook so you can correlate results with your records.
                  example:
                    crm_lead_id: lead_9876
                    source: website_form
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: integer
                    description: Correlate this with call logs and support requests.
                    example: 4521
                  token:
                    type: string
                    description: The Session Token. Single conversation, unguessable.
                    example: sess_51gF2qw8LxNz0vY4mT7Ka3RjD9pBcE6HuWiQnZsX0oM
                  expires_at:
                    type: string
                    format: date-time
                    description: End of the 15-minute connect window (UTC).
                    example: "2026-07-17T12:15:00Z"
                  ws_url:
                    type: string
                    description: Connect your client to this URL as returned.
                    example: wss://live.omnidim.io/chat/start_voice_chat?request_token=sess_51gF2qw8LxNz0vY4mT7Ka3RjD9pBcE6HuWiQnZsX0oM
        "400":
          description: |
            Unsupported session type (`unsupported_type`) or a malformed
            request body (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: unsupported_type
                error_description: Only type 'voice' is supported.
        "401":
          description: Missing or invalid API key.
        "402":
          description: The organization balance is too low to start a call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: insufficient_balance
                error_description: Balance is low. Please Choose Appropriate plan.
        "404":
          description: Agent not found in your organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: agent_not_found
                error_description: Agent not found or access denied
        "429":
          description: |
            The organization is at its concurrent call limit. Wait for a
            call to finish or purchase more concurrency, then retry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionError"
                  - type: object
                    properties:
                      limit:
                        type: integer
                        description: Your organization's concurrent call limit.
              example:
                error: concurrency_limit_reached
                error_description: Your organization is at its concurrent call limit (2). Wait for a call to finish or purchase more concurrency.
                limit: 2
