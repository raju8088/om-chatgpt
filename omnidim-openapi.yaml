  /agents/create:
    post:
      tags:
        - Agents
      operationId: createAgent
      summary: Create agent
      description: |
        Create a new agent with the provided configuration. The full
        config supports transcriber, model, voice, web search, transfer,
        end-call conditions, post-call actions (email + webhook),
        ambient background track, initial ringing sound, and multilingual support.

        > **Voicemail detection is an access-gated feature** that we turn on per
        account. If it isn't enabled for yours yet,
        [request access](https://omnidim.io/contact-us?reason=product&lock=1)
        before configuring the `voicemail` object.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client

            client = Client(api_key)

            # Create a basic agent
            response = client.agent.create(
                name="Customer Support Agent",
                welcome_message="Hello! I'm your customer support assistant. How can I help you today?",
                context_breakdown=[
                    {"title": "Purpose", "body": "This agent helps customers with product inquiries and support issues."}
                ]
            )
            print(response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AgentConfigInput"
                - type: object
                  required:
                    - name
                    - welcome_message
                    - context_breakdown
      responses:
        "200":
          description: Created agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Agent identifier. Use this in subsequent calls to `/agents/{agent_id}`.
                  name:
                    type: string
                    description: Echoes the `name` you submitted.
                  status:
                    type: string
                    description: Build state of the agent. Always `Completed` for newly created agents.
              example:
                id: 6365
                name: Customer Support Agent
                status: Completed
