    post:
      tags:
        - Reseller
      operationId: setUserAccessControl
      summary: Update user access control
      description: |
        Enable or disable dashboard menu access flags for a child user.
        Only the flags you pass are changed. Flags outside your
        reseller's permissions are silently ignored.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Only the flags you pass change. Flags outside your own
            # permissions are ignored rather than escalating.
            response = client.reseller.set_access_control(
                user_id=1234,
                dashboard_menu_access={"is_bots_menu_access": True},
            )
            print(response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - dashboard_menu_access
              properties:
                user_id:
                  type: integer
                  description: ID of the child user to update.
                dashboard_menu_access:
                  allOf:
                    - $ref: '#/components/schemas/ResellerDashboardMenuAccess'
                  description: |
                    Flags to update. Only pass the flags you want to
                    change. Others are left untouched. Flags outside
                    your reseller's permissions are silently dropped.
            example:
              user_id: 1234
              dashboard_menu_access:
                is_bots_menu_access: true
                is_call_logs_menu_access: true
                is_phone_number_access: false
      responses:
        "200":
          description: Access control updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  updated_flags:
                    allOf:
                      - $ref: '#/components/schemas/ResellerDashboardMenuAccess'
                    description: The flags that were actually applied (after the reseller-scope filter).
                example:
                  success: true
                  message: User access control updated successfully
                  updated_flags:
                    is_bots_menu_access: true
                    is_call_logs_menu_access: true
                    is_phone_number_access: false
  /reseller/users/expiry:
    post:
      tags:
        - Reseller
      operationId: setUserExpiry
      summary: Update user expiry
      description: |
        Set or remove the expiry date on a child user. The user must
        belong to a child organization of your reseller.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            response = client.reseller.set_expiry(user_id=1234, expiry_date="2026-12-31")

            # Pass None to remove the expiry.
            response = client.reseller.set_expiry(user_id=1234, expiry_date=None)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: integer
                  description: ID of the child user to update.
                expiry_date:
                  type: string
                  format: date
                  nullable: true
                  description: Expiry date in `YYYY-MM-DD` format. Omit or pass `null` to remove the expiry.
            example:
              user_id: 1234
              expiry_date: "2026-12-31"
      responses:
        "200":
          description: Expiry updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  user_id: { type: integer }
                  expiry_date:
                    type: string
                    format: date
                    nullable: true
                example:
                  success: true
                  message: User expiry date updated successfully
                  user_id: 1234
                  expiry_date: "2026-12-31"
  /reseller/concurrency:
    post:
      tags:
        - Reseller
      operationId: setChildConcurrency
      summary: Set child concurrency limit
      description: |
        Set the maximum number of simultaneous calls a client can run.
        `new_limit` is the absolute figure you want, not a change to the
        current one.

        Assigning is free: any figure is accepted, nothing is deducted from
        you, and this call never fails for lack of capacity.

        It does not create capacity, though. Your own concurrent call limit is
        the ceiling for your whole account family at dial time, so what you set
        here is a per-client cap, and your own limit is the capacity those caps
        compete for. Assign a client more than you hold and the extra simply
        cannot be dialed.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # The absolute number, not a change to the current one. Assigning
            # is free; your own limit is the capacity these caps compete for.
            response = client.reseller.set_concurrency(child_organization_id=5678, new_limit=5)
            print(response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - child_organization_id
                - new_limit
              properties:
                child_organization_id:
                  type: integer
                  description: ID of the child organization to update.
                new_limit:
                  type: integer
                  description: The desired absolute concurrent call limit (must be `>= 0`).
            example:
              child_organization_id: 4002
              new_limit: 5
      responses:
        "200":
          description: Concurrency limit updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  child_limit:
                    type: integer
                    description: The child organization's new concurrent call limit.
                  reseller_available:
                    type: integer
                    description: |
                      Your own concurrent call limit, which is the shared
                      dial-time ceiling for your whole family. Assigning to
                      clients does not draw it down.
                example:
                  success: true
                  message: Concurrency limit updated successfully.
                  child_limit: 5
                  reseller_available: 7
  /reseller/credits/calculate:
    post:
      tags:
        - Reseller
      operationId: calculateCreditOperation
      summary: Calculate credit operation
      description: |
        Preview the cost of a transfer or revert without moving any
        credits. Use this to confirm amounts before calling the
        transfer or revert endpoints. The response shape differs
        between forward transfers and reverts. See the examples.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Nothing moves on this call. Preview before you commit.
            response = client.reseller.calculate_credits(minutes=100, cost_per_min=0.20)

            # A revert needs no rate: the client is deducted at theirs.
            response = client.reseller.calculate_credits(
                minutes=40, is_revert=True, child_organization_id=5678
            )
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - minutes
              properties:
                minutes:
                  type: integer
                  description: Number of minutes to calculate for.
                cost_per_min:
                  type: number
                  description: Rate per minute for a forward transfer (e.g. `0.20`). Not required when `is_revert` is `true`.
                  example: 0.2
                is_revert:
                  type: boolean
                  description: Set to `true` to calculate a revert instead of a forward transfer.
                  default: false
                child_organization_id:
                  type: integer
                  description: ID of the child organization to revert credits from. Required when `is_revert` is `true`.
            example:
              minutes: 100
              cost_per_min: 0.2
      responses:
        "200":
          description: Calculated outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  my_cost:
                    type: number
                    description: Forward only. Amount deducted from the reseller balance.
                  user_credit:
                    type: number
                    description: Forward only. Credit value the child receives at `cost_per_min`.
                  profit:
                    type: number
                    description: Forward only. `user_credit - my_cost`.
                  margin:
                    type: number
                    description: Forward only. Per-minute margin.
                  reseller_balance:
                    type: number
                    description: Forward only. Current reseller balance before the transfer.
                  reseller_available_minutes:
                    type: integer
                    description: Forward only. Minutes the reseller could still transfer at its own rate.
                  new_reseller_balance:
                    type: number
                    description: Forward only. Reseller balance after the proposed transfer.
                  refund_amount:
                    type: number
                    description: Revert only. Credits added back to the reseller.
                  deduction_amount:
                    type: number
                    description: Revert only. Credits removed from the child at its current rate.
                  child_balance:
                    type: number
                    description: Revert only. Child balance before the revert.
                  child_available_minutes:
                    type: integer
                    description: Revert only. Minutes available in the child's balance.
                  new_child_balance:
                    type: number
                    description: Revert only. Child balance after the proposed revert.
                  reseller_rate:
                    type: number
                    description: Reseller's wholesale rate (cost per minute).
                  currency_symbol: { type: string }
              examples:
                forward:
                  summary: Forward transfer (500 min at $0.20/min)
                  value:
                    success: true
                    my_cost: 45.0
                    user_credit: 50.0
                    profit: 5.0
                    margin: 0.01
                    reseller_rate: 0.09
                    reseller_balance: 66.113
                    reseller_available_minutes: 734
                    new_reseller_balance: 21.113
                    currency_symbol: "$"
                revert:
                  summary: Revert (10 min from a child)
                  value:
                    success: true
                    refund_amount: 0.9
                    deduction_amount: 2.0
                    reseller_rate: 0.09
                    child_balance: 10.0
                    child_available_minutes: 50
                    new_child_balance: 8.0
                    currency_symbol: "$"
  /reseller/credits/transfer:
    post:
      tags:
        - Reseller
      operationId: transferCreditsToChild
      summary: Transfer credits to a child
      description: |
        Transfer minutes from your balance to a client, at the rate you set.

        Two different amounts move: your balance is debited at your own rate,
        and the client is credited at `cost_per_min`. The gap between them is
        your margin, so a `cost_per_min` below your own rate is refused as a
        loss rather than silently costing you money on every call.

        The target organization must be a direct child of your reseller. Use
        the calculate endpoint first to preview both amounts.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Your balance is debited at your rate, the client is credited at
            # the rate you set here. The gap is your margin.
            response = client.reseller.transfer_credits(
                to_organization_id=5678, minutes=100, cost_per_min=0.20
            )
            print(response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to_organization_id
                - minutes
                - cost_per_min
              properties:
                to_organization_id:
                  type: integer
                  description: ID of the child organization to transfer credits to.
                minutes:
                  type: integer
                  description: Number of minutes to transfer.
                cost_per_min:
                  type: number
                  description: Rate per minute to charge the child organization (e.g. `0.20`).
                  example: 0.2
            example:
              to_organization_id: 4002
              minutes: 20
              cost_per_min: 0.20
      responses:
        "200":
          description: Transfer succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  new_from_balance:
                    type: number
                    description: Reseller balance after the transfer.
                  new_to_balance:
                    type: number
                    description: Child balance after the transfer.
                example:
                  success: true
                  message: Credits allocated successfully
                  new_from_balance: 59.813
                  new_to_balance: 14.0
  /reseller/credits/revert:
    post:
      tags:
        - Reseller
      operationId: revertCreditsFromChild
      summary: Revert credits
      description: |
        Take unused minutes back from a client. The exact mirror of a
        transfer, so you do not pass a rate.

        The client is deducted at their own current rate, which is what they
        were charged, and you are refunded at your rate, which is what it cost
        you. Use the calculate endpoint first to preview both amounts.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # No rate: the client is deducted at their current one and you are
            # refunded at yours.
            response = client.reseller.revert_credits(from_organization_id=5678, minutes=40)
            print(response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_organization_id
                - minutes
              properties:
                from_organization_id:
                  type: integer
                  description: ID of the child organization to revert credits from.
                minutes:
                  type: integer
                  description: Number of minutes to revert.
            example:
              from_organization_id: 4002
              minutes: 5
      responses:
        "200":
          description: Credits reverted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  new_from_balance:
                    type: number
                    description: Child balance after the revert.
                  new_to_balance:
                    type: number
                    description: Reseller balance after the revert.
                example:
                  success: true
                  message: Credits reverted successfully
                  new_from_balance: 13.0
                  new_to_balance: 60.263
