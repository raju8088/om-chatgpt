  /calls/bulk_call/create:
    post:
      tags:
        - Bulk calls
      operationId: createBulkCall
      summary: Create bulk call
      description: |
        Create a new bulk-call campaign. Only name, phone_number_id and a
        contact_list are needed to dial a list now; every other field adds
        one behavior on top (drafts, rotation, filtering, scheduling,
        retries, dynamic feeding).

        The guide below the field reference walks the whole journey: the
        first campaign and its response, each behavior with a working
        request, every refusal message with its fix, and the endpoints that
        operate a campaign once it runs.

      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client

            client = Client(api_key)

            response = client.bulk_call.create_bulk_call({
                "name": "Customer Follow-up Campaign",
                "contact_list": [
                    {
                        "phone_number": "+15551234567",
                        "customer_name": "John Doe",   # optional context key
                        "account_id": "ACC-12345",     # optional context key
                    },
                    {
                        "phone_number": "+15559876543",
                        "customer_name": "Jane Smith", # optional context key
                        "account_id": "ACC-67890",     # optional context key
                    },
                ],
                "phone_number_id": "1",                # required
                "is_scheduled": False,                 # optional
                "retry_config": {                      # optional
                    "auto_retry": True,
                    "auto_retry_schedule": "next_day",
                    "retry_limit": 2,
                },
                "enabled_reschedule_call": True,       # optional
            })

            print(response)
        - lang: bash
          label: Dynamic (cURL)
          source: |
            # Create a dynamic campaign with no contacts up front.
            # Feed it later with the add_contact webhook.
            curl -X POST "https://omnidim.io/api/v1/calls/bulk_call/create" \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Real-Time Lead Outreach",
                "phone_number_id": "1",
                "is_dynamic": true
              }'
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Customer follow-ups
              phone_number_id: "177"
              bot_id: 512
              contact_list:
                - phone_number: "+15551234567"
                  customer_name: John Doe
                  plan: pro
                - phone_number: "+15559876543"
                  customer_name: Jane Smith
                  plan: trial
              call_conditions:
                - column: plan
                  operator: equals
                  value: pro
              rotation:
                numbers:
                  - phone_number_id: 177
                    sequence: 10
                  - phone_number_id: 178
                    sequence: 20
                strategy: fixed_count
                calls_per_number: 50
              is_scheduled: true
              scheduled_datetime: "2026-12-25 10:00:00"
              timezone: America/New_York
              concurrent_call_limit: 3
              retry_config:
                auto_retry: true
                auto_retry_schedule: next_day
                retry_limit: 2
              enabled_reschedule_call: true
            schema:
              type: object
              required:
                - name
                - phone_number_id
              properties:
                name:
                  type: string
                  description: Name of the bulk call campaign.
                  example: Customer Follow-up Campaign
                phone_number_id:
                  type: string
                  example: "177"
                  description: |
                    The number this campaign calls from. With a `rotation`, the
                    rotation numbers dial instead and this one is the standby.
                bot_id:
                  type: integer
                  description: |
                    Agent to run the campaign. Defaults to the agent attached
                    to `phone_number_id`; required when the number has none.
                save_as_draft:
                  type: boolean
                  default: false
                  description: |
                    Store the campaign without dialing; start it later with the
                    start endpoint. See Drafts in the guide below.
                call_conditions:
                  type: array
                  description: |
                    Dial only the contacts that match every condition; the rest
                    are kept as `Skipped`. See Filtering in the guide below.
                  items:
                    type: object
                    required:
                      - column
                      - operator
                      - value
                    properties:
                      column:
                        type: string
                        description: Key on the contact row to test.
                        example: plan
                      operator:
                        type: string
                        default: equals
                        example: equals
                        enum:
                          - equals
                          - not_equals
                          - contains
                          - greater_than
                          - less_than
                        description: |
                          `contains` is case-insensitive. `greater_than` and
                          `less_than` compare numerically, and a row whose value
                          is not a number fails the condition rather than
                          erroring.
                      value:
                        type: string
                        example: pro
                rotation:
                  type: object
                  description: |
                    Rotate the campaign across several of your numbers, so no
                    single number burns out. See Rotation in the guide below.
                  required:
                    - numbers
                  properties:
                    numbers:
                      type: array
                      minItems: 1
                      description: |
                        The numbers to rotate across; each must be yours and
                        listed once.
                      items:
                        type: object
                        required:
                          - phone_number_id
                        properties:
                          phone_number_id:
                            type: integer
                            example: 177
                            description: One of your numbers, from List phone numbers.
                          sequence:
                            type: integer
                            default: 10
                            description: Rotation order. Lowest dials first.
                    strategy:
                      type: string
                      default: fixed_count
                      example: fixed_count
                      enum:
                        - fixed_count
                        - cpr_threshold
                        - both
                        - none
                      description: |
                        When to move to the next number: every
                        `calls_per_number` calls, on low health score, both, or
                        never.
                    calls_per_number:
                      type: integer
                      default: 50
                      example: 50
                      description: Calls before moving on. Used by `fixed_count` and `both`.
                    health_threshold:
                      type: number
                      default: 30.0
                      description: |
                        Health score below which a number is rotated away from.
                        Used by `cpr_threshold` and `both`.
                    fallback:
                      type: string
                      default: pause
                      enum:
                        - pause
                        - continue_best
                      description: |
                        When every number is unhealthy: `pause` the campaign,
                        or `continue_best` with the healthiest one.
                is_dynamic:
                  type: boolean
                  default: false
                  description: |
                    A dynamic campaign stays alive accepting contacts via the
                    add-contact webhooks, and `contact_list` becomes optional.
                contact_list:
                  type: array
                  description: |
                    Who to call. Each row needs `phone_number`; any other key
                    reaches the agent as context for that one call.
                  items:
                    type: object
                    required:
                      - phone_number
                    properties:
                      phone_number:
                        type: string
                        description: Phone number in international format (e.g., +15551234567).
                        example: "+15551234567"
                    additionalProperties: true
                  example:
                    - phone_number: "+15551234567"
                      customer_name: John Doe
                      account_id: ACC-12345
                    - phone_number: "+15559876543"
                      customer_name: Jane Smith
                      account_id: ACC-67890
                      priority: high
                is_scheduled:
                  type: boolean
                  default: false
                  description: Whether the campaign should be scheduled for future execution.
                scheduled_datetime:
                  type: string
                  description: Scheduled execution time in format `YYYY-MM-DD HH:MM:SS` (required if `is_scheduled` is true).
                  example: "2026-12-25 10:00:00"
                timezone:
                  type: string
                  default: UTC
                  description: Timezone for scheduled execution.
                  example: America/New_York
                concurrent_call_limit:
                  type: integer
                  default: 1
                  minimum: 1
                  description: Maximum number of concurrent calls allowed.
                enabled_reschedule_call:
                  type: boolean
                  default: false
                  description: Enable automatic call rescheduling. When enabled the system can reschedule unreachable calls.
                retry_config:
                  type: object
                  description: Auto-retry configuration object containing retry settings.
                  properties:
                    auto_retry:
                      type: boolean
                      default: false
                    auto_retry_schedule:
                      type: string
                      enum:
                        - immediately
                        - next_day
                        - scheduled_time
                      description: When to retry failed calls.
                    retry_schedule_days:
                      type: integer
                      default: 0
                      minimum: 0
                      description: Days to wait before a scheduled retry.
                    retry_schedule_hours:
                      type: integer
                      default: 0
                      minimum: 0
                      description: Hours to wait before a scheduled retry.
                    retry_limit:
                      type: integer
                      default: 1
                      minimum: 1
                      maximum: 10
                      description: |
                        Retry attempts, 1 to 10. To disable retries omit it and
                        leave `auto_retry` false; never send `0`.
      responses:
        "200":
          description: |
            Bulk call campaign created. `current_status` is `scheduled`
            for `is_scheduled: true`. A dynamic campaign created with no
            contacts comes back `waiting` (alive, ready for webhook
            contacts). Otherwise it is dispatching to your concurrency
            limit immediately after creation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  id:
                    type: integer
                    description: New campaign ID.
                  is_scheduled:
                    type: boolean
                  is_dynamic:
                    type: boolean
                  current_status:
                    type: string
              example:
                status: success
                message: Bulk call created successfully
                id: 314
                is_scheduled: false
                is_dynamic: false
                current_status: pending
  /calls/bulk_call/{campaign_id}/add_contact:
    post:
      tags:
        - Bulk calls
      operationId: addBulkCallContact
      summary: Add contact to dynamic campaign
      description: |
        Push a single contact into a dynamic bulk-call campaign in real
        time. Dynamic campaigns are created from the dashboard (Bulk Call
        > Create New Campaign > Dynamic Campaign) and stay alive waiting
        for contacts, so this webhook is how you feed them from a CRM,
        form, or automation platform. The contact is queued immediately,
        and the campaign starts calling it as soon as it is within
        operating hours.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://omnidim.io/api/v1/calls/bulk_call/123/add_contact" \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "to_number": "+15551234567",
                "custom_variables": {
                  "name": "Demo User",
                  "interest": "Home Insurance"
                },
                "metadata": {
                  "crm_lead_id": "lead_9876",
                  "source": "website_form"
                }
              }'
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: ID of the dynamic campaign to add the contact to.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to_number
              properties:
                to_number:
                  type: string
                  description: Contact phone number in international format (e.g., +15551234567).
                  example: "+15551234567"
                custom_variables:
                  type: object
                  description: |
                    Key-value pairs passed to the agent as context for this
                    call, so the agent can reference them during the
                    conversation (e.g. the contact's name or reason for the
                    call). Match these keys to the variables used in your
                    agent's welcome message or prompt.
                  additionalProperties: true
                  example:
                    name: Demo User
                    interest: Home Insurance
                metadata:
                  type: object
                  description: |
                    Key-value pairs stored on the contact for your own
                    tracking (e.g. CRM or lead IDs). Not shared with the
                    agent.
                  additionalProperties: true
                  example:
                    crm_lead_id: lead_9876
                    source: website_form
      responses:
        "200":
          description: |
            Contact accepted and queued. `campaign_status` reflects the
            campaign state after the contact was added (`in_progress` when
            calling resumes, or `waiting` / `auto_paused` when the contact
            is queued for the next operating window).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  campaign_id:
                    type: integer
                  line_id:
                    type: integer
                    nullable: true
                    description: ID of the new contact record in this campaign.
                  campaign_status:
                    type: string
                  to_number:
                    type: string
              example:
                status: success
                message: Contact added successfully
                campaign_id: 123
                line_id: 4567
                campaign_status: in_progress
                to_number: "+15551234567"
