      description: |
        Create a new child user and organization under the reseller.
        The new organization is linked to your reseller account
        automatically.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Creates the user and their organization together, linked to you.
            # cost_per_min is what you sell at, and cannot be below your rate.
            response = client.reseller.add_user(
                name="Demo User",
                email="demo@example.com",
                phone="+15551234567",
                password=client_password,
                cost_per_min=0.20,
            )
            user_id = response["json"]["user_id"]
            organization_id = response["json"]["organization_id"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phone
                - password
              properties:
                name:
                  type: string
                  description: Full name of the new user.
                email:
                  type: string
                  format: email
                  description: Email address. Also used as the login.
                phone:
                  type: string
                  description: Phone number including country code (e.g. `+15551234567`).
                  example: "+15551234567"
                password:
                  type: string
                  format: password
                  description: Account password for the new user.
                welcome_minutes_to_credit:
                  type: integer
                  description: Minutes to credit to the new account on signup.
                cost_per_min:
                  type: number
                  description: Cost per minute charged to this user (e.g. `0.20`). Must be at least the reseller's premium model rate.
                  example: 0.2
                concurrent_call_limit:
                  type: integer
                  description: Maximum number of concurrent calls allowed for this account.
                expiry_date:
                  type: string
                  format: date
                  description: Account expiry date in `YYYY-MM-DD` format (e.g. `2026-12-31`).
                user_currency:
                  type: string
                  description: ISO 4217 currency code for the account (e.g. `USD`, `INR`). Defaults to the reseller's currency.
                  example: USD
            example:
              name: Demo User
              email: demo@example.com
              phone: "+15551234567"
              password: SecurePass123!
              welcome_minutes_to_credit: 50
              cost_per_min: 0.20
              concurrent_call_limit: 2
              expiry_date: "2026-12-31"
              user_currency: USD
