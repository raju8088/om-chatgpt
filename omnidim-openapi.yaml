  /phone_number/search:
    get:
      tags:
        - Phone numbers
      operationId: searchPhoneNumbers
      summary: Search available phone numbers
      description: |
        Search the OmniDimension number shop for phone numbers available to buy
        in a region. Price and validity are flat per region, so every result
        shows the same `monthly_rental_usd` and `validity_days`, and that is the
        exact amount a purchase will charge.

        A region can have more than one carrier, each stocking different
        number series. Pass the `carrier` you want; the response names the
        carrier its results came from, and that is the carrier a purchase has
        to pass.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # carrier is required: a region can hold more than one, and they do
            # not stock the same numbers.
            found = client.phone_number.search("IN", carrier="carrier-1")["json"]

            for number in found["numbers"]:
                print(number["phone_number"], number["monthly_rental_usd"])
      parameters:
        - name: region
          in: query
          required: true
          description: |
            Region to search in. `IN` and `US` both serve numbers. Which
            regions answer is configuration, so a region with no carrier
            enabled returns `404 not_available` rather than an empty list.
          schema:
            type: string
            enum: [IN, US]
          example: IN
        - name: carrier
          in: query
          required: true
          description: |
            Which carrier's stock to search: carriers in a region do not sell
            the same numbers. Always required, even where a region holds one,
            and omitting it returns `409 carrier_required` naming that
            region's carriers and what each one stocks.
          schema:
            type: string
          example: carrier-1
        - name: pattern
          in: query
          required: false
          description: Digits or prefix to match within the number.
          schema:
            type: string
          example: "555"
        - name: page
          in: query
          required: false
          description: Page of results to return.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 150
            default: 20
        - name: user_id
          in: query
          required: false
          description: "Reseller accounts only: the client to act on. Omit it to act on your own account."
          schema:
            type: integer
      responses:
        "200":
          description: Numbers available in this region.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  region:
                    type: string
                    enum: [IN, US]
                  carrier:
                    type: string
                    description: The carrier these results came from. Pass it to the purchase operation to buy one of them.
                  carrier_label:
                    type: string
                    description: Display name of that carrier.
                  numbers:
                    type: array
                    items:
                      type: object
                      properties:
                        phone_number:
                          type: string
                        monthly_rental_usd:
                          type: number
                          description: Amount, in USD, that a purchase of this number will charge per month.
                        validity_days:
                          type: integer
                          description: Days the number stays active before it has to be renewed.
                        region:
                          type: string
                          enum: [IN, US]
                        kyc_required:
                          type: boolean
                          description: Whether identity verification is required before buying this number.
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  total_pages:
                    type: integer
              example:
                success: true
                region: IN
                carrier: carrier-1
                carrier_label: Carrier 1
                numbers:
                  - phone_number: "+918000000001"
                    monthly_rental_usd: 5.06
                    validity_days: 30
                    region: IN
                    kyc_required: true
                total: 1
                page: 1
                limit: 20
                total_pages: 1
        "400":
          description: "`page` or `limit` is not a valid integer, or is out of range."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: invalid_request
                error_description: page must be >= 1 and limit between 1 and 150.
        "401":
          description: Missing or invalid API key.
        "403":
          description: |
            A `user_id` was sent by a key that is not a reseller admin, or
            the named client's account is currently unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: forbidden
                error_description: Access denied. Only reseller accounts can use this endpoint.
        "404":
          description: |
            The `user_id` did not name one of your clients (`not_found`),
            or numbers are not available for this region (`not_available`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: not_found
                error_description: Child user not found.
        "409":
          description: |
            This region has more than one carrier and the request named
            none. The body lists the carriers to choose from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierRequiredError"
              example:
                error: carrier_required
                error_description: Region IN has more than one carrier and no default. Pass carrier=<name> with one of the carriers listed here.
                region: IN
                carriers:
                  - carrier: carrier-1
                    label: Carrier 1
                    description: Landline numbers, 80 series.
                    kyc_required: true
                    unavailable: false
                    unavailable_note: null
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionError"
                  - type: object
                    properties:
                      ref:
                        type: string
                        description: Reference to quote to support.
              example:
                error: server_error
                error_description: Something went wrong on our side. Please try again shortly, or contact support with reference a1b2c3d4e5f6.
                ref: a1b2c3d4e5f6

  /phone_number/purchase:
    post:
      tags:
        - Phone numbers
      operationId: purchasePhoneNumber
      summary: Purchase a phone number
      description: |
        Buy a phone number from the OmniDimension number shop. The monthly
        rental comes out of your wallet and the number is added to your
        account, ready to attach to an agent.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Buy from the carrier you searched: the search response names it.
            response = client.phone_number.purchase(
                "IN", "+918000000001", carrier="carrier-1", idempotency_key=str(uuid4())
            )
            print(response)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Your own unique key for this purchase, for example a
            fresh UUID. Strongly recommended: it is what makes a
            retry safe.
          schema:
            type: string
          example: 9f2c1d40-7a53-4b8e-9b7a-1c2d3e4f5a6b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - region
                - carrier
                - phone_number
              properties:
                region:
                  type: string
                  enum: [IN, US]
                  description: Region the number belongs to.
                phone_number:
                  type: string
                  description: The number to buy, as returned by the search operation.
                  example: "+15551234567"
                carrier:
                  type: string
                  description: |
                    The carrier to buy from: pass the `carrier` the search
                    response named, so you buy from the inventory you searched.
                    Always required, and omitting it returns
                    `409 carrier_required` naming that region's carriers.
                  example: carrier-1
                user_id:
                  type: integer
                  description: "Reseller accounts only: the client to act on. Omit it to act on your own account."
            example:
              region: IN
              carrier: carrier-1
              phone_number: "+918000000001"
      responses:
        "200":
          description: |
            The number was purchased, or the same `Idempotency-Key`
            was replayed and the original order is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  replayed:
                    type: boolean
                    description: Present only when this key was already used. The order was not charged again.
                  order_id:
                    type: integer
                  phone_number:
                    type: string
                  amount:
                    type: number
                    description: Amount charged, in USD.
                  new_balance:
                    type: number
                    description: The owning account's balance after the charge. Not present on a replay.
                  status:
                    type: string
                    description: Always `completed` on a successful purchase.
                    enum: [completed]
              examples:
                purchased:
                  summary: purchased
                  value:
                    success: true
                    order_id: 5678
                    phone_number: "+15551234567"
                    amount: 5.0
                    new_balance: 120.5
                    status: completed
                replayed:
                  summary: replayed
                  value:
                    success: true
                    replayed: true
                    order_id: 5678
                    phone_number: "+15551234567"
                    amount: 5.0
                    status: completed
        "400":
          description: A required field is missing, or `phone_number` is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: invalid_request
                error_description: Invalid phone number format.
        "401":
          description: Missing or invalid API key.
        "402":
          description: The client does not have enough balance for this purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: insufficient_balance
                error_description: Insufficient balance.
        "403":
          description: |
            Phone number access is switched off for the account buying
            (`feature_disabled`), a `user_id` was sent by a key that is not a
            reseller admin, or the named client's account is currently
            unavailable (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: feature_disabled
                error_description: Phone number access is disabled for this user.
        "404":
          description: |
            The `user_id` did not name one of your clients (`not_found`),
            or numbers are not available for this region (`not_available`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: not_found
                error_description: Child user not found.
        "409":
          description: |
            The purchase was refused before anything was charged: identity
            verification is not complete (`kyc_incomplete`), an earlier
            purchase is still running (`in_progress`), the number was taken by
            someone else (`number_unavailable`), or the region has more than
            one carrier and the request named none (`carrier_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              examples:
                kyc_incomplete:
                  summary: kyc_incomplete
                  value:
                    error: kyc_incomplete
                    error_description: Complete identity verification for this region first.
                carrier_required:
                  summary: carrier_required
                  value:
                    error: carrier_required
                    error_description: Region IN has more than one carrier and no default. Pass carrier=<name> with one of the carriers listed here.
                    region: IN
                    carriers:
                      - carrier: carrier-1
                        label: Carrier 1
                        description: Landline numbers, 80 series.
                        kyc_required: true
                        unavailable: false
                        unavailable_note: null
        "422":
          description: The purchase could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: purchase_failed
                error_description: The purchase could not be completed. Please try again or contact support.
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionError"
                  - type: object
                    properties:
                      ref:
                        type: string
                        description: Reference to quote to support.
              example:
                error: server_error
                error_description: Something went wrong on our side. Please try again shortly, or contact support with reference a1b2c3d4e5f6.
                ref: a1b2c3d4e5f6

  /phone_number/release:
    post:
      tags:
        - Phone numbers
      operationId: releasePhoneNumber
      summary: Release a phone number
      description: |
        Give up a phone number and stop its rental, so it is not charged at the
        next renewal. Only a number currently allocated to the account can be
        released.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Gives the number up and stops its rental at the next renewal.
            response = client.phone_number.release("+918000000001")
            print(response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number
              properties:
                phone_number:
                  type: string
                  description: The number to release.
                  example: "+15551234567"
                user_id:
                  type: integer
                  description: "Reseller accounts only: the client to act on. Omit it to act on your own account."
            example:
              phone_number: "+15551234567"
      responses:
        "200":
          description: The number was released.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  phone_number:
                    type: string
                  status:
                    type: string
                    enum: [released]
              example:
                success: true
                phone_number: "+15551234567"
                status: released
        "400":
          description: The request body is missing a required field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: invalid_request
                error_description: "Missing required fields: phone_number."
        "401":
          description: Missing or invalid API key.
        "403":
          description: |
            A `user_id` was sent by a key that is not a reseller admin, or
            the named client's account is currently unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: forbidden
                error_description: Access denied. Only reseller accounts can use this endpoint.
        "404":
          description: |
            The `user_id` did not name one of your clients (`not_found`),
            or the account holds no such number (`number_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: number_not_found
                error_description: No such number on this user.
        "422":
          description: The number could not be released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: release_failed
                error_description: The number could not be released. Please try again or contact support.
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionError"
                  - type: object
                    properties:
                      ref:
                        type: string
                        description: Reference to quote to support.
              example:
                error: server_error
                error_description: Something went wrong on our side. Please try again shortly, or contact support with reference a1b2c3d4e5f6.
                ref: a1b2c3d4e5f6

