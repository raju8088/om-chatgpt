    get:
      tags:
        - Bulk calls
      operationId: fetchBulkCalls
      summary: Fetch bulk calls
      description: List bulk-call campaigns with pagination and optional status filter.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Fetch all bulk calls with pagination
            response = client.bulk_call.fetch_bulk_calls(page=1, page_size=10)
            print(response)

            # Filter bulk calls by status
            response = client.bulk_call.fetch_bulk_calls(page=1, page_size=10, status="completed")
            print(response)
      parameters:
        - name: pageno
          in: query
          description: Page number for pagination.
          schema:
            type: integer
            default: 1
        - name: pagesize
          in: query
          schema:
            type: integer
            default: 10
            maximum: 150
          description: Items per page (max 150).
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status (e.g. completed).
      responses:
        "200":
          description: Paginated list of bulk calls.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, error]
