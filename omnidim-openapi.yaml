  /reseller/kyc/status:
    get:
      tags:
        - Reseller
      operationId: getResellerKycStatus
      summary: Get KYC status
      description: |
        Get the identity verification status of a client for every carrier it
        can verify on. Use `next_step` to know which step to call next, so
        you drive the whole flow off one poll instead of hardcoding the
        sequence.

        Verification is per carrier, not per region: a client verified on one
        carrier of a region still has to verify on the other before it can
        buy there. A region with one carrier returns exactly one entry.

      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            status = client.reseller.kyc_status(user_id=1234)["json"]

            # One entry per carrier, not per region: a client verified on one
            # carrier still has to verify on the other before it can buy there.
            for entry in status["regions"]:
                print(entry["carrier"], entry["next_step"], entry["can_purchase"])
      parameters:
        - name: user_id
          in: query
          required: true
          description: ID of the child user to check.
          schema:
            type: integer
          example: 1234
      responses:
        "200":
          description: KYC status per region.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user_id:
                    type: integer
                  regions:
                    type: array
                    description: One entry per carrier, each with that carrier's verification state.
                    items:
                      type: object
                      properties:
                        region:
                          type: string
                          enum: [IN, US]
                        carrier:
                          type: string
                          description: The carrier this entry is about. Pass it to the verification calls and to a purchase.
                          example: carrier-1
                        carrier_label:
                          type: string
                          description: Display name of that carrier.
                          example: Carrier 1
                        kyc_required:
                          type: boolean
                          description: Whether this client must complete verification before buying a number in this region.
                        can_purchase:
                          type: boolean
                          description: Whether this client can buy a number on this carrier right now. Always agrees with what a purchase attempt would allow.
                        status:
                          type: string
                          description: |
                            Where this client has reached in verification.
                            `not_started` before anything is submitted,
                            `completed` once they are verified. Drive your
                            integration off `next_step`, not this value.
                        next_step:
                          type: string
                          nullable: true
                          description: |
                            The step to call next, or `null` when there is
                            nothing left for you to do.

                            Not a fixed list. Which steps exist depends on
                            the carrier, and carriers do not run the same
                            checks. Read the step list from
                            `GET /reseller/kyc/requirements` for that carrier
                            and follow this field; never hard-code the names.

                            `null` with `can_purchase: false` means the
                            carrier is still reviewing the submission. See
                            `review_status`.
                        review_status:
                          type: string
                          nullable: true
                          description: |
                            Set when the carrier is holding a finished
                            submission for its own review, which is why
                            `can_purchase` can still be false with no step
                            left to call. `null` otherwise.
              example:
                success: true
                user_id: 1234
                regions:
                  - region: IN
                    carrier: carrier-1
                    carrier_label: Carrier 1
                    kyc_required: true
                    can_purchase: false
                    status: pan_verified
                    next_step: aadhaar-otp
                    review_status: null
                  - region: IN
                    carrier: carrier-2-new
                    carrier_label: Carrier 2 (new)
                    kyc_required: true
                    can_purchase: false
                    status: not_started
                    next_step: register
                    review_status: null
        "401":
          description: Missing or invalid API key.
        "403":
          description: |
            A `user_id` was sent by a key that is not a reseller admin, or
            the named client's account is currently unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: forbidden
                error_description: Access denied. Only reseller accounts can use this endpoint.
        "404":
          description: Child user not found under this reseller account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: not_found
                error_description: Child user not found.
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionError"
                  - type: object
                    properties:
                      ref:
                        type: string
                        description: Reference to quote to support.
              example:
                error: server_error
                error_description: Something went wrong on our side. Please try again shortly, or contact support with reference a1b2c3d4e5f6.
                ref: a1b2c3d4e5f6

  /reseller/kyc/requirements:
    get:
      tags:
        - Reseller
      operationId: getResellerKycRequirements
      summary: Get KYC requirements for a region
      description: |
        Get the ordered list of verification steps for a carrier and the
        fields each step needs, so your integration can build a verification
        form without hardcoding the sequence.

        Carriers in the same region do not share a step list. One verifies
        contact details with an OTP pair and ends in a preview-then-accept;
        another has no OTP step at all and verifies Aadhaar by sending the
        client to DigiLocker in a browser. Read this endpoint per carrier,
        branch on each step's `method`, and one integration drives both.


      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            # Call this before you build anything: the steps, the fields each
            # one needs, and how each one is performed all come from here.
            requirements = client.reseller.kyc_requirements("IN", carrier="carrier-1")["json"]

            for step in requirements["steps"]:
                print(step["step"], step["method"], step["required"])
      parameters:
        - name: region
          in: query
          required: true
          description: Region to get verification requirements for.
          schema:
            type: string
            enum: [IN, US]
          example: IN
        - name: carrier
          in: query
          required: true
          description: |
            Which carrier's steps to return: carriers in a region do not share
            a step list. Always required, even where a region holds one, and
            omitting it returns `409 carrier_required` naming that region's
            carriers.
          schema:
            type: string
          example: carrier-1
      responses:
        "200":
          description: Verification requirements for the region.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  region:
                    type: string
                    enum: [IN, US]
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        step:
                          type: string
                          description: |
                            The step name to pass in the path. Not a fixed
                            list: carriers do not run the same checks, so
                            read the names from this response rather than
                            hard-coding them.
                        required:
                          type: array
                          items:
                            type: string
                          description: Body fields this step requires, beyond `user_id`, `region`, and `carrier`.
                        cooldown:
                          type: boolean
                          description: Whether this step is rate-limited. When true, wait about 30 seconds between attempts.
                        choices:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: string
                          description: |
                            Fixed vocabularies, per field, for the fields that
                            have one. Build your control from this rather than
                            hard-coding the values: sending anything outside a
                            published list is refused with `400
                            invalid_request` naming what is allowed. `{}` when
                            the step has no such field.
                        method:
                          type: string
                          enum: [submit, otp, redirect]
                          description: |
                            How to perform this step.

                            `submit` posts the `required` fields. `otp` posts
                            a code the customer received. `redirect` returns a
                            `redirect_url` for the customer to open in their
                            own browser, after which you poll `poll_step`.

                            Branch on this, not on the region or the step
                            name, and one integration drives every carrier.
              example:
                success: true
                region: IN
                steps:
                  - step: register
                    required: [email, name, phone]
                    cooldown: false
                    choices: {}
                    method: submit
                  - step: verify-otp
                    required: [email_otp, mobile_otp]
                    cooldown: false
                    method: submit
                  - step: resend-otp
                    required: []
                    cooldown: false
                    method: submit
                  - step: verify-pan
                    required: [business_type, pan]
                    cooldown: false
                    method: submit
                  - step: aadhaar-otp
                    required: [aadhaar]
                    cooldown: true
                    method: otp
                  - step: aadhaar-verify
                    required: [otp]
                    cooldown: true
                    method: otp
                  - step: verify-gst
                    required: [gst]
                    cooldown: false
                    method: submit
                  - step: skip-gst
                    required: []
                    cooldown: false
                    method: submit
                  - step: preview
                    required: []
                    cooldown: false
                    method: submit
                  - step: accept
                    required: []
                    cooldown: false
                    method: submit
        "401":
          description: Missing or invalid API key.
        "403":
          description: The caller's account cannot use the reseller API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: forbidden
                error_description: Access denied. Only reseller accounts can use this endpoint.
        "404":
          description: |
            No verification flow is configured for this region
            (`not_available`), or the request named a carrier the region
            does not have (`unknown_carrier`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              examples:
                not_available:
                  summary: not_available
                  value:
                    error: not_available
                    error_description: Verification is not available for this region.
                unknown_carrier:
                  summary: unknown_carrier
                  value:
                    error: unknown_carrier
                    error_description: There is no carrier 'carrier-9' in region IN.
                    region: IN
                    carriers:
                      - carrier: carrier-1
                        label: Carrier 1
                        description: Landline numbers, 80 series.
                        kyc_required: true
                        unavailable: false
                        unavailable_note: null
        "409":
          description: |
            This region has more than one carrier and the request named
            none. The body lists the carriers to choose from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierRequiredError"
              example:
                error: carrier_required
                error_description: Region IN has more than one carrier and no default. Pass carrier=<name> with one of the carriers listed here.
                region: IN
                carriers:
                  - carrier: carrier-1
                    label: Carrier 1
                    description: Landline numbers, 80 series.
                    kyc_required: true
                    unavailable: false
                    unavailable_note: null
                  - carrier: carrier-2-new
                    label: Carrier 2 (new)
                    description: Mobile numbers, 94 and 79 series.
                    kyc_required: true
                    unavailable: false
                    unavailable_note: null
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionError"
                  - type: object
                    properties:
                      ref:
                        type: string
                        description: Reference to quote to support.
              example:
                error: server_error
                error_description: Something went wrong on our side. Please try again shortly, or contact support with reference a1b2c3d4e5f6.
                ref: a1b2c3d4e5f6

  /reseller/kyc/steps/{step}:
    post:
      tags:
        - Reseller
      operationId: submitResellerKycStep
      summary: Submit a KYC verification step
      description: |
        Run one step of a client's identity verification. One endpoint handles
        every step: the `step` path parameter names the step, and the body
        carries `user_id`, `region`, `carrier`, and whatever that step needs.
        The example below is the `register` step on `carrier-1`.

        Which steps exist, which fields they need, and how each one is
        performed are all per carrier. Read them from the requirements
        operation for the carrier you are on, follow `next_step`, and branch
        on `method`.
      x-codeSamples:
        - lang: python
          label: Python SDK
          source: |
            from omnidimension import Client
            client = Client(api_key)

            user_id, region, carrier = 1234, "IN", "carrier-1"

            # Read the first step, then follow next_step. Never hard-code the
            # sequence: carriers do not run the same checks.
            status = client.reseller.kyc_status(user_id)["json"]
            entry = next(e for e in status["regions"] if e["carrier"] == carrier)
            next_step = entry["next_step"]

            while next_step:
                response = client.reseller.submit_kyc_step(
                    next_step, user_id, region, carrier=carrier, **fields_for(next_step)
                )["json"]

                # Branch on method, never on the step's name.
                if response.get("method") == "redirect":
                    # Single use, expires in minutes. Never store it.
                    send_to_customer(response["redirect_url"])
                    next_step = response["poll_step"]
                    continue

                next_step = response.get("next_step")
      parameters:
        - name: step
          in: path
          required: true
          description: |
            The verification step to run. Not a fixed list: carriers do not run
            the same checks, so take the names from
            `GET /reseller/kyc/requirements` for the carrier you are on.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - region
                - carrier
              properties:
                user_id:
                  type: integer
                  description: ID of the client completing verification.
                region:
                  type: string
                  enum: [IN, US]
                  description: Region this verification is for.
                carrier:
                  type: string
                  description: |
                    The carrier to verify on: verification is per carrier, so
                    this decides which flow the client walks and which record
                    it writes. Always required, and omitting it returns
                    `409 carrier_required` naming that region's carriers.
                  example: carrier-1
                name:
                  type: string
                  description: Customer's full name. Required for `register`.
                  example: Demo User
                email:
                  type: string
                  format: email
                  description: Customer's email address. Required for `register`.
                  example: demo@example.com
                phone:
                  type: string
                  description: Customer's phone number including country code. Required for `register`.
                  example: "+919876543210"
                mobile_otp:
                  type: string
                  description: OTP the client received by mobile. Required for `verify-otp`.
                email_otp:
                  type: string
                  description: OTP the client received by email. Required for `verify-otp`.
                pan:
                  type: string
                  description: Customer's PAN. Required for `verify-pan`.
                business_type:
                  type: string
                  description: |
                    The customer's business type. Required on the PAN step of
                    the India carriers and on the business-details step of the
                    US carrier, and the accepted values differ between them.
                    Read them from `choices` on the requirements response
                    rather than assuming a list.
                aadhaar:
                  type: string
                  description: |
                    Customer's Aadhaar number. Required for `aadhaar-otp`.
                    Rate limited to one attempt roughly every 30 seconds.
                otp:
                  type: string
                  description: |
                    OTP the client received for Aadhaar verification.
                    Required for `aadhaar-verify`. Rate limited to one
                    attempt roughly every 30 seconds.
                gst:
                  type: string
                  description: Customer's GST number. Required for `verify-gst`.
                state:
                  type: string
                  description: |
                    Required for `register` on carriers that register at
                    district level, and for the US carrier's business address
                    step (where it is the two-letter state code).
                  example: Gujarat
                district:
                  type: string
                  description: |
                    Customer's district. Required for `register` on carriers
                    that register at district level, and validated against
                    the state, so a district that does not belong to it is
                    rejected with nothing written.
                  example: Surat
                pincode:
                  type: string
                  description: Customer's postal code. Required for `register` on carriers that register at district level.
                  example: "395003"
                pan_holder_name:
                  type: string
                  description: |
                    Name exactly as it appears on the PAN. Required for
                    `verify-pan` on carriers that check the name against the
                    PAN record.
                  example: Demo User
                account_type:
                  type: string
                  description: |
                    Optional on `register`, defaults to `individual`. **Fixed
                    at registration and not changeable afterwards**, and only a
                    business account can verify GST, so send it deliberately.
                    Accepted values come from `choices` on the requirements
                    response; anything else is refused with `400
                    invalid_request` rather than quietly registered as an
                    individual.
                business_name:
                  type: string
                  description: |
                    Trading name. Required when `account_type` is `business`
                    on the India carriers, and required on the US carrier's
                    business-details step.
                business_identity:
                  type: string
                  description: |
                    How the business relates to its end customers. Required on
                    the US carrier's business-details step; values come from
                    `choices`.
                business_industry:
                  type: string
                  description: |
                    The industry the business operates in. Required on the US
                    carrier's business-details step; values come from
                    `choices`.
                ein:
                  type: string
                  description: The business's tax registration number. Required on the US carrier's business-details step.
                  example: 12-3456789
                website_url:
                  type: string
                  description: The business's public website. Required on the US carrier's business-details step.
                  example: https://demo.example
                regions_of_operation:
                  type: string
                  description: |
                    Where the business operates. Optional on the US carrier's
                    business-details step, defaults to USA and Canada; values
                    come from `choices`.
                street:
                  type: string
                  description: Street address. Required on the US carrier's business-address step.
                  example: 1 Demo Street
                city:
                  type: string
                  description: City. Required on the US carrier's business-address step.
                  example: Springfield
                postal_code:
                  type: string
                  description: Postal code. Required on the US carrier's business-address step.
                  example: "62701"
                country:
                  type: string
                  description: Two-letter country code. Optional on the US carrier's business-address step, defaults to US.
                  example: US
                first_name:
                  type: string
                  description: The authorized representative's first name. Required on the US carrier's representative step.
                  example: Demo
                last_name:
                  type: string
                  description: The authorized representative's last name. Required on the US carrier's representative step.
                  example: User
                business_title:
                  type: string
                  description: The representative's job title, as free text. Required on the US carrier's representative step.
                  example: Head of Operations
                job_position:
                  type: string
                  description: |
                    The representative's role, from a fixed list. Required on
                    the US carrier's representative step; values come from
                    `choices`.
            example:
              user_id: 1234
              region: IN
              carrier: carrier-1
              name: Demo User
              email: demo@example.com
              phone: "+919876543210"
      responses:
        "200":
          description: |
            Step completed. `preview` is only present in the response
            to the `preview` step, and only carries the fields listed
            below; any field the verification provider does not have
            yet is omitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    description: |
                      Where this client has reached in verification.
                      `not_started` before anything is submitted,
                      `completed` once they are verified. Drive your
                      integration off `next_step`, not this value.
                  next_step:
                    type: string
                    nullable: true
                    description: |
                      The step to run next. Chain to it without re-reading
                      status. `null` once there is nothing left for you to do.

                      Not a fixed list: which steps exist depends on the
                      carrier. Follow this field and the step list from
                      `/reseller/kyc/requirements`.
                  method:
                    type: string
                    enum: [submit, otp, redirect]
                    description: |
                      Echoes how the step that just ran is performed. Present
                      on every step response.
                  redirect_url:
                    type: string
                    nullable: true
                    description: |
                      Only on a `redirect` step. Send your customer to this
                      link in their own browser, then poll `poll_step`.

                      **Single use.** It expires within minutes and must not
                      be stored or reused. Call the step again for a new one:
                      repeating it is safe and always returns a fresh link.
                  reusable:
                    type: boolean
                    nullable: true
                    description: |
                      Only on a `redirect` step, and always `false`. Stated
                      as a field so a client library can enforce it.
                  poll_step:
                    type: string
                    nullable: true
                    description: |
                      Only on a `redirect` step. The step to call, repeatedly,
                      to find out whether the customer finished.
                  message:
                    type: string
                    description: Human-readable confirmation for the step that just ran.
                  preview:
                    type: object
                    description: Present only in the response to the `preview` step.
                    properties:
                      client:
                        type: object
                        properties:
                          name: { type: string }
                          email: { type: string, format: email }
                          mobile: { type: string }
                          country_code: { type: string }
                      pan:
                        type: object
                        properties:
                          pan: { type: string }
                          business_type: { type: string }
                      aadhar:
                        type: object
                        properties:
                          name: { type: string }
                          address: { type: string }
                      gst:
                        type: object
                        properties:
                          gst_num: { type: string }
                          gstin: { type: string }
              examples:
                accept:
                  summary: accept
                  value:
                    success: true
                    status: completed
                    message: Verification completed.
                redirect:
                  summary: a redirect step
                  value:
                    success: true
                    status: aadhaar_pending
                    next_step: aadhaar-status
                    message: Open the link to verify with DigiLocker, then poll for the result.
                    method: redirect
                    redirect_url: https://provider.example/verify/one-time-link
                    reusable: false
                    poll_step: aadhaar-status
                preview:
                  summary: preview
                  value:
                    success: true
                    status: preview
                    message: Review the details, then call accept.
                    preview:
                      client:
                        name: Demo User
                        email: demo@example.com
                        mobile: "9876543210"
                        country_code: "91"
                      pan:
                        pan: ABCDE1234F
                        business_type: proprietorship
                      aadhar:
                        name: Demo User
                        address: "123 Example Street, Example City, 560001"
                      gst:
                        gst_num: "29ABCDE1234F1Z5"
                        gstin: "29ABCDE1234F1Z5"
        "400":
          description: The request body is missing a field the step requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: invalid_request
                error_description: "Missing required fields: pan, business_type."
        "401":
          description: Missing or invalid API key.
        "403":
          description: |
            A `user_id` was sent by a key that is not a reseller admin, or
            the named client's account is currently unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: forbidden
                error_description: Access denied. Only reseller accounts can use this endpoint.
        "404":
          description: |
            The child user was not found (`not_found`), or verification
            is not available for this region or step (`not_available`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: not_found
                error_description: Child user not found.
        "409":
          description: |
            The step was called before its prerequisite step was completed
            (`step_order`), or the region has more than one carrier and the
            request named none (`carrier_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              examples:
                step_order:
                  summary: step_order
                  value:
                    error: step_order
                    error_description: Complete the contact verification (OTP) step first.
                carrier_required:
                  summary: carrier_required
                  value:
                    error: carrier_required
                    error_description: Region IN has more than one carrier and no default. Pass carrier=<name> with one of the carriers listed here.
                    region: IN
                    carriers:
                      - carrier: carrier-1
                        label: Carrier 1
                        description: Landline numbers, 80 series.
                        kyc_required: true
                        unavailable: false
                        unavailable_note: null
        "422":
          description: The verification provider rejected the submitted details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: verification_failed
                error_description: OTP verification failed. Please try again.
        "429":
          description: An Aadhaar step was retried before the cooldown elapsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
              example:
                error: too_fast
                error_description: Please wait a moment before retrying this step.
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionError"
                  - type: object
                    properties:
                      ref:
                        type: string
                        description: Reference to quote to support.
              example:
                error: server_error
                error_description: Something went wrong on our side. Please try again shortly, or contact support with reference a1b2c3d4e5f6.
                ref: a1b2c3d4e5f6
